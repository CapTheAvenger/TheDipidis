name: is_ace_spec reparieren

# Einmaliger Aufraeumlauf, per Hand ausgeloest.
#
# Warum als Workflow und nicht als normaler Commit: die Reparatur beruehrt
# 21 CSVs mit zusammen rund 155 MB, darunter data/city_league_analysis_M3.csv
# mit knapp 30 MB. Ueber die GitHub-Weboberflaeche laesst sich das nicht
# hochladen (25 MB je Datei). Der Runner hat Schreibrechte und rechnet die
# Aenderung ohnehin selbst aus — hier wird also nichts hochgeladen, sondern
# aus den Daten im Repo neu bestimmt.
#
# Der Lauf ist wiederholbar: laeuft er ein zweites Mal, aendert sich nichts
# und es wird nichts committet.
#
# Was geaendert wird, steht ausschliesslich in der Spalte is_ace_spec —
# scripts/repariere_ace_spec.py prueft das nach dem Schreiben Zeile fuer
# Zeile nach und bricht ab, wenn eine andere Spalte abweicht.

on:
  workflow_dispatch:
    inputs:
      schreiben:
        description: 'Wirklich schreiben und committen (sonst nur berichten)'
        type: boolean
        default: false

permissions:
  contents: write   # die reparierten CSVs committen
  actions: write   # deploy-pages anstossen (GITHUB_TOKEN-Push tut es nicht)

concurrency:
  group: ace-spec-reparatur
  cancel-in-progress: false

jobs:
  reparieren:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Bericht (immer)
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python scripts/repariere_ace_spec.py 2>&1 | tee /tmp/ace.log
          if grep -q '^::error::' /tmp/ace.log; then
            echo "::error::Reparatur meldet einen Fehler — nichts geschrieben."
            exit 1
          fi

      - name: Schreiben
        if: ${{ inputs.schreiben }}
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python scripts/repariere_ace_spec.py --schreiben 2>&1 | tee /tmp/ace-schreiben.log
          if grep -q '^::error::' /tmp/ace-schreiben.log; then
            echo "::error::Nachpruefung fehlgeschlagen — Aenderung wird nicht committet."
            exit 1
          fi

      - name: Gegenprobe — nur is_ace_spec darf abweichen
        if: ${{ inputs.schreiben }}
        run: |
          # Zweite, unabhaengige Pruefung gegen den Stand vor dem Lauf:
          # jedes geaenderte Byte muss in dieser einen Spalte liegen.
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, os.getcwd())
          from scripts.repariere_ace_spec import felder, lies, zerlege_zeilen
          geaendert = subprocess.run(
              ["git", "diff", "--name-only", "--", "data"],
              capture_output=True, text=True, check=True).stdout.split()
          if not geaendert:
              print("Keine Datei geaendert.")
              sys.exit(0)
          fehler = 0
          for pfad in geaendert:
              alt_text = subprocess.run(["git", "show", "HEAD:" + pfad],
                                        capture_output=True, check=True).stdout.decode("utf-8")
              _, tr, namen, neu_z = lies(pfad)
              alt_z = zerlege_zeilen(alt_text)
              if len(alt_z) != len(neu_z) or "is_ace_spec" not in namen:
                  print("::error::%s: Zeilenzahl oder Kopf veraendert." % pfad); fehler += 1; continue
              i = namen.index("is_ace_spec")
              for a, b in zip(alt_z[1:], neu_z[1:]):
                  fa = [w for w, _, _ in felder(a.rstrip("\r\n"), tr)]
                  fb = [w for w, _, _ in felder(b.rstrip("\r\n"), tr)]
                  if len(fa) != len(fb):
                      print("::error::%s: Feldzahl veraendert." % pfad); fehler += 1; break
                  for k, (x, y) in enumerate(zip(fa, fb)):
                      if k != i and x != y:
                          print("::error::%s: Spalte %r veraendert (%r -> %r)."
                                % (pfad, namen[k], x, y)); fehler += 1; break
                  else:
                      continue
                  break
          if fehler:
              sys.exit(1)
          print("Gegenprobe sauber: %d Dateien, nur is_ace_spec abweichend." % len(geaendert))
          PY

      - name: Tests
        if: ${{ inputs.schreiben }}
        run: |
          python -m pip install --quiet pytest
          # test_ace_spec_bestand.py prueft den ausgelieferten Bestand und
          # kann es erst, wenn dieser Lauf ihn einmal geraeumt hat — beim
          # ersten Mal liegt die Datei deshalb noch nicht im Repo.
          dateien="tests/python/test_ace_spec_regel.py"
          if [ -f tests/python/test_ace_spec_bestand.py ]; then
            dateien="$dateien tests/python/test_ace_spec_bestand.py"
          else
            echo "::notice::test_ace_spec_bestand.py noch nicht im Repo — kommt im Folge-PR."
          fi
          python -m pytest $dateien -q

      - name: Committen
        id: commit
        if: ${{ inputs.schreiben }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data
          if git diff --cached --quiet; then
            echo "Nichts geaendert — der Bestand war schon sauber."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Daten: is_ace_spec belegt statt geraten — $(date -u +'%Y-%m-%d %H:%M UTC')"
          for versuch in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase=true --autostash -X ours origin main || exit 1
          done
          echo "::error::Push nach 3 Versuchen fehlgeschlagen"; exit 1

      # Ein Push mit GITHUB_TOKEN loest `on: push` nicht aus. Ohne diesen
      # Anstoss laegen die reparierten CSVs zwar auf main, wuerden aber nicht
      # ausgeliefert — die Seite bliebe still auf dem alten Stand.
      - name: Deploy anstossen
        if: ${{ inputs.schreiben && steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
