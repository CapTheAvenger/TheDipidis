name: Champions Replica Scrape

# Twice-weekly refresh of the Pokémon Champions Side Quest tab.
# Fetches the VGCPastes Google Sheet, parses the top-N team rows, and
# for each one fetches the linked pokepast.es paste to materialize a
# {mon, ability, item, EVs, nature, moves, tera} record. Writes
# data/champions_replica_teams.json — the file the Side Quest tab in
# js/app-side-quest.js consumes.
#
# Lightweight job under normal conditions (~25 s for the scrape itself),
# but the Claude-API strategy-generation step on a fresh / heavily-
# changed cache can take ~15 min — that's why the job timeout is 45 min
# (see jobs.scrape.timeout-minutes below).
#
# Cadence changed 2026-06-12 from daily to Tuesdays + Fridays. The
# VGCPastes community sheet doesn't see new tournament-winning teams
# every day; a 3-4 day cadence catches every meaningful update without
# triggering the team-strategy generator (Claude API cost) on noisy
# day-over-day churn that doesn't change the actual strategy.
#
# Trigger: Tuesday + Friday at 10:00 UTC OR GitHub UI → Actions →
#          Champions Replica Scrape → Run workflow

on:
  schedule:
    # 10:00 UTC = 11:00 CET winter / 12:00 CEST summer.
    # cron day-of-week: 2 = Tuesday, 5 = Friday.
    - cron: '0 10 * * 2,5'
  workflow_dispatch:
    inputs:
      top:
        description: 'Number of top teams to include'
        type: string
        default: '20'

permissions:
  contents: write
  actions:  write   # needed for the `gh workflow run deploy-pages.yml`
                    # dispatch step at the end — without this the
                    # GITHUB_TOKEN returns 403 "Resource not accessible
                    # by integration" on the workflow_dispatch API call
                    # (observed 2026-06-10).

concurrency:
  group: champions-replica-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 45 min instead of 10: the strategy-generation step (Claude API)
    # can take 30-60 s per team with adaptive thinking, so the first
    # full run (~20 teams = ~15-20 min) used to hit the 10-min cap and
    # the job got cancelled mid-generation. Delta runs (1-2 new teams
    # per day) finish well inside this budget too.
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The scraper writes to backend/core/data/ (legacy data_dir
      # resolution in card_scraper_shared.get_data_dir). Pre-seed the
      # previous snapshot so the fail-soft "0 teams → keep old JSON"
      # path has something to fall back to.
      - name: Seed backend/core/data/ from data/
        run: |
          mkdir -p backend/core/data
          if [ -f data/champions_replica_teams.json ]; then
            cp data/champions_replica_teams.json backend/core/data/champions_replica_teams.json
          fi

      - name: Run champions-replica scraper
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        run: |
          set +e
          echo "::group::scrapers/champions_replica_scraper.py"
          TOP="${{ github.event.inputs.top }}"
          TOP="${TOP:-20}"
          python backend/scrapers/champions_replica_scraper.py --top "$TOP"
          rc=$?
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
              echo "::warning::champions_replica_scraper exited with $rc"
          fi
          exit 0  # never block — scraper is fail-soft, JSON is kept

      - name: Copy output back to data/
        run: |
          if [ -f backend/core/data/champions_replica_teams.json ]; then
            cp backend/core/data/champions_replica_teams.json data/champions_replica_teams.json
          fi
          # Speed corpus (added 2026-06-15): broader EV/nature sample
          # the Side Quest Play panel uses for typical-Speed estimation.
          if [ -f backend/core/data/champions_speed_corpus.json ]; then
            cp backend/core/data/champions_speed_corpus.json data/champions_speed_corpus.json
          fi

      # DISABLED (2026-06-16): server-side strategy generation via the
      # Claude API was the only recurring cost of the Side Quest feature.
      # We now offer a zero-cost client-side alternative instead — the
      # "How to play this team (via Claude)" button copies a ready-made
      # prompt and opens Claude in the user's own browser (js/app-side-
      # quest.js → openClaudeForTeam). Already-generated guides in
      # data/champions_team_strategies.json stay cached and keep showing.
      # To re-enable paid auto-generation, flip `if:` back to true.
      - name: Generate team strategies (Claude API)
        if: false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          echo "::group::scripts/generate_team_strategies.py"
          # -u: unbuffered stdout so per-team progress shows in real
          # time in the Actions log (otherwise long generations look
          # like the job is frozen and you can't tell which team is
          # currently running).
          python -u scripts/generate_team_strategies.py
          rc=$?
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
              echo "::warning::generate_team_strategies exited with $rc — strategies JSON kept as-is"
              git checkout -- data/champions_team_strategies.json 2>/dev/null
          fi
          exit 0

      - name: Bump version
        run: |
          chmod +x bump-version.sh
          ./bump-version.sh

      - name: Commit + push
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/champions_replica_teams.json \
                  index.html service-worker.js version.json
          # Strategies file only exists once the ANTHROPIC_API_KEY
          # secret is set and the generator ran at least once.
          if [ -f data/champions_team_strategies.json ]; then
            git add data/champions_team_strategies.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to champions_replica_teams.json — skipping push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: champions-replica scrape — ${ts}

          Triggered by .github/workflows/champions-replica-scrape.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Push-with-retry — same pattern weekly-full-update uses, since
          # this job overlaps the daily-price-refresh window on some
          # days and origin/main can advance while we run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase=true -X ours origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      # Without this, the new JSON sits on main but the live site keeps
      # serving the previous Pages build — the user saw their 30-team
      # run land on main but the Side Quest tab kept showing yesterday's
      # 20 teams (2026-06-09 user report). weekly-full-update.yml and
      # daily-price-refresh.yml both dispatch this — match the pattern.
      - name: Trigger GitHub Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo "Dispatched deploy-pages.yml on main."
