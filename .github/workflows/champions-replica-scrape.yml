name: Champions Replica Scrape

# Daily refresh of the Pokémon Champions Side Quest tab.
# Fetches the VGCPastes Google Sheet, parses the top-N team rows, and
# for each one fetches the linked pokepast.es paste to materialize a
# {mon, ability, item, EVs, nature, moves, tera} record. Writes
# data/champions_replica_teams.json — the file the Side Quest tab in
# js/app-side-quest.js consumes.
#
# Lightweight job (~25 s scrape + ~40 pokepaste fetches). The old
# Claude-API strategy-generation step is disabled (see the "Generate
# team strategies" step below), so there's no API cost and nothing slow
# left — the job runs comfortably inside its timeout.
#
# Cadence: daily. It was briefly cut to Tue+Fri (2026-06-12) only to
# avoid running the paid strategy generator on day-over-day churn. With
# that step now disabled and replaced by the zero-cost client-side
# "via Claude" button, daily is free again — so we catch new
# tournament-winning teams the day they're shared.
#
# Trigger: daily at 04:00 UTC OR GitHub UI → Actions →
#          Champions Replica Scrape → Run workflow

on:
  schedule:
    # 04:00 UTC = 05:00 CET winter / 06:00 CEST summer. Scheduled so the
    # whole job (scrape + build + deploy) finishes well before 08:00
    # German time, regardless of DST. Fixed-UTC cron: summer (UTC+2) is
    # the binding case — finishing before 06:00 UTC guarantees "done by
    # 08:00 CEST"; in winter it just finishes an hour earlier.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      top:
        description: 'Number of top teams to include'
        type: string
        default: '40'

permissions:
  contents: write   # `actions: write` used to be here for the explicit
                    # `gh workflow run deploy-pages.yml` dispatch at the end.
                    # That dispatch is gone (it raced the push-triggered deploy
                    # inside `concurrency: pages`), so the extra scope goes with
                    # it — least privilege.

concurrency:
  group: champions-replica-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 30 min: the replica scrape is ~25 s + ~40 pokepaste fetches, but the
    # in-game usage scrape adds ~1000 throttled sequential requests
    # (championsbattledata, ~234 Pokémon × api+2 CSVs) which takes ~8–10 min
    # on its own. Generous headroom against a slow host.
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The scraper writes to backend/core/data/ (legacy data_dir
      # resolution in card_scraper_shared.get_data_dir). Pre-seed the
      # previous snapshot so the fail-soft "0 teams → keep old JSON"
      # path has something to fall back to.
      - name: Seed backend/core/data/ from data/
        run: |
          mkdir -p backend/core/data
          if [ -f data/champions_replica_teams.json ]; then
            cp data/champions_replica_teams.json backend/core/data/champions_replica_teams.json
          fi

      - name: Run champions-replica scraper
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        run: |
          set +e
          echo "::group::scrapers/champions_replica_scraper.py"
          TOP="${{ github.event.inputs.top }}"
          TOP="${TOP:-40}"
          python backend/scrapers/champions_replica_scraper.py --top "$TOP"
          rc=$?
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
              echo "::warning::champions_replica_scraper exited with $rc"
          fi
          exit 0  # never block — scraper is fail-soft, JSON is kept

      - name: Copy output back to data/
        run: |
          if [ -f backend/core/data/champions_replica_teams.json ]; then
            cp backend/core/data/champions_replica_teams.json data/champions_replica_teams.json
          fi
          # Speed corpus (added 2026-06-15): broader EV/nature sample
          # the Side Quest Play panel uses for typical-Speed estimation.
          if [ -f backend/core/data/champions_speed_corpus.json ]; then
            cp backend/core/data/champions_speed_corpus.json data/champions_speed_corpus.json
          fi

      # DISABLED (2026-06-16): server-side strategy generation via the
      # Claude API was the only recurring cost of the Side Quest feature.
      # We now offer a zero-cost client-side alternative instead — the
      # "How to play this team (via Claude)" button copies a ready-made
      # prompt and opens Claude in the user's own browser (js/app-side-
      # quest.js → openClaudeForTeam). Already-generated guides in
      # data/champions_team_strategies.json stay cached and keep showing.
      # To re-enable paid auto-generation, flip `if:` back to true.
      - name: Generate team strategies (Claude API)
        if: false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          echo "::group::scripts/generate_team_strategies.py"
          # -u: unbuffered stdout so per-team progress shows in real
          # time in the Actions log (otherwise long generations look
          # like the job is frozen and you can't tell which team is
          # currently running).
          python -u scripts/generate_team_strategies.py
          rc=$?
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
              echo "::warning::generate_team_strategies exited with $rc — strategies JSON kept as-is"
              git checkout -- data/champions_team_strategies.json 2>/dev/null
          fi
          exit 0

      # Refresh the authoritative DE↔EN name maps (PokeWiki moves +
      # pokemonexperte items). Reachable from CI (not from the build
      # sandbox). Fail-soft: keeps the committed overrides on any error.
      - name: Scrape German name maps
        run: |
          set +e
          python -u scripts/scrape_de_names.py
          if [ "$?" -ne 0 ]; then
              echo "::warning::scrape_de_names failed — keeping committed de_name_overrides.json"
              git checkout -- data/de_name_overrides.json 2>/dev/null
          fi
          exit 0

      # Refresh the list of items actually available in Champions (Serebii's
      # Champions items page). Drives the "Champions only" filter in the
      # Look-up tab. Fail-soft: keeps the committed list on any error.
      - name: Scrape Champions item availability
        run: |
          set +e
          python -u scripts/scrape_champions_items.py
          if [ "$?" -ne 0 ]; then
              echo "::warning::scrape_champions_items failed — keeping committed champions_available_items.json"
              git checkout -- data/champions_available_items.json 2>/dev/null
          fi
          exit 0

      # Rebuild the Side Quest "Look up" reference (items/abilities/moves/
      # field effects) from the Champions dataset + PokéAPI + the scraped
      # German name overrides + the Champions item-availability list.
      # Fail-soft: keeps the committed JSON.
      - name: Build Champions resources reference
        run: |
          set +e
          python -u scripts/build_champions_resources.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
              echo "::warning::build_champions_resources exited with $rc — resources JSON kept as-is"
              git checkout -- data/champions_resources.json 2>/dev/null
          fi
          exit 0

      # Refresh the Champions roster additions (M-B+ Pokémon/megas not in
      # the M-A dataset) from pokebase + Smogon. Fail-soft: keeps committed.
      - name: Scrape Champions roster additions
        run: |
          set +e
          python -u scripts/scrape_champions_roster.py
          if [ "$?" -ne 0 ]; then
              echo "::warning::scrape_champions_roster failed — keeping committed champions_roster_extra.json"
              git checkout -- data/champions_roster_extra.json 2>/dev/null
          fi
          exit 0

      # Refresh the authoritative in-game usage analysis (most-used nature /
      # SP spread / item / move / ability / teammate per Pokémon, per format)
      # from championsbattledata.com — a public mirror of the in-game ranked
      # "Statuswertanpassung / Statuswertpunkte / …" screens. This is the
      # source the Pokédex "Meist genutzt" line uses (it's the real ladder
      # usage; the old VGCPastes top-team sample was small and biased).
      # Reachable from CI, not the build sandbox. Fail-soft: keeps committed.
      - name: Scrape in-game Champions usage
        run: |
          set +e
          python -u scripts/scrape_champions_usage.py
          if [ "$?" -ne 0 ]; then
              echo "::warning::scrape_champions_usage failed — keeping committed champions_usage.json"
              git checkout -- data/champions_usage.json 2>/dev/null
          fi
          exit 0

      # Refresh the pokemonproxies.com image index (set+number -> English proxy
      # art) for Japanese-only sets like M5 that have no international print.
      # Content-hashed asset URLs, so this rarely changes — but a refresh keeps
      # it correct if pokemonproxies re-hashes or adds a new JP-only set.
      # Reachable from CI, not the build sandbox. Fail-soft: keeps committed.
      - name: Scrape pokemonproxies image index
        run: |
          set +e
          python -u scripts/scrape_pokemonproxies.py
          if [ "$?" -ne 0 ]; then
              echo "::warning::scrape_pokemonproxies failed — keeping committed pokemonproxies_index.json"
              git checkout -- data/pokemonproxies_index.json 2>/dev/null
          fi
          exit 0

      # Rebuild the Side Quest "Pokémon" Pokédex (roster + base stats +
      # German names + Lv.50 ranges + the in-game "most used" build).
      # Fail-soft: keeps the committed JSON.
      - name: Build Champions Pokédex
        run: |
          set +e
          python -u scripts/build_champions_pokedex.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
              echo "::warning::build_champions_pokedex exited with $rc — pokedex JSON kept as-is"
              git checkout -- data/champions_pokedex.json 2>/dev/null
          fi
          exit 0

      # No bump here. deploy-pages.yml rewrites ?v=, APP_VERSION, the service
      # worker CACHE_NAME, version.json and the _formatWindow snapshot inside
      # _site/ on every deploy (its "Cache-bust asset references" step), so the
      # stamp a data job commits never reaches a user. All it did was put
      # index.html (845 KB), service-worker.js and version.json into ~147
      # commits a month and churn the service worker's CACHE_NAME, which makes
      # the activate handler drop every client cache several times a day.

      - name: Commit + push
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/champions_replica_teams.json \
                  data/champions_resources.json \
                  data/champions_pokedex.json \
                  data/champions_usage.json \
                  data/champions_names_de.json \
                  data/champions_roster_extra.json \
                  data/champions_available_items.json \
                  data/de_name_overrides.json \
                  data/pokemonproxies_index.json
          # Strategies file only exists once the ANTHROPIC_API_KEY
          # secret is set and the generator ran at least once.
          if [ -f data/champions_team_strategies.json ]; then
            git add data/champions_team_strategies.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to champions_replica_teams.json — skipping push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: champions-replica scrape — ${ts}

          Triggered by .github/workflows/champions-replica-scrape.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Push-with-retry — same pattern weekly-full-update uses, since
          # this job overlaps the daily-price-refresh window on some
          # days and origin/main can advance while we run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # --autostash: the scrapers/build can leave unstaged changes in
            # tracked files that aren't in the `git add` list above; without
            # autostash the rebase aborts with "cannot pull with rebase: You
            # have unstaged changes" (observed 2026-06-29).
            git pull --rebase=true --autostash -X ours origin main || { git rebase --abort 2>/dev/null || true; exit 1; }
          done
          exit 1

      # Without this, the new JSON sits on main but the live site keeps
      # serving the previous Pages build — the user saw their 30-team
      # run land on main but the Side Quest tab kept showing yesterday's
      # 20 teams (2026-06-09 user report). weekly-full-update.yml and
      # daily-price-refresh.yml both dispatch this — match the pattern.
      # No explicit deploy dispatch. The push above already triggers
      # deploy-pages (on: push to main); dispatching a second run put both into
      # `concurrency: pages, cancel-in-progress: true`, so one of the two was
      # cancelled and the deploy could end up watching or reporting the loser.
      # One push, one deploy.
