name: Champions Usage Refresh

# Lean, fast refresh of just the in-game usage data + the Pokédex (and the
# EN→DE name maps), decoupled from the heavy champions-replica-scrape (whose
# pokepaste fetches are often slow). Runs the usage scraper (with retry +
# regression guard), rebuilds the Pokédex, commits and deploys.
#
# Trigger: GitHub UI → Actions → Champions Usage Refresh → Run workflow.
# Also runs daily as a safety net so the usage data stays fresh even if the
# replica scrape is slow/blocked.

on:
  schedule:
    # 05:00 UTC = 06:00 CET winter / 07:00 CEST summer — 1 h after the
    # replica scrape's 04:00 UTC slot so the two never overlap (this stays
    # the safety net that runs *after* the heavy job). Finishes well before
    # 08:00 German time year-round (summer/UTC+2 is the binding case).
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write            # for the deploy-pages dispatch at the end

concurrency:
  group: champions-usage-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Authoritative in-game usage (nature / SP / item / move / ability /
      # teammate, per format).
      #
      # This step used to swallow its own failure: on a non-zero exit it ran
      # `git checkout -- data/champions_usage.json`, printed a ::warning:: and
      # exited 0. The commit step further down then committed the *other* files
      # and the run went green. Result: 31 consecutive green runs while
      # champions_usage.json had not changed since 2026-07-17, and the Side Quest
      # usage view served month-old numbers with no indication anywhere.
      #
      # Keeping the last good snapshot is right — overwriting it with a thin,
      # rate-limited scrape would be worse. Reporting success is not. The rollback
      # stays, the green tick goes.
      #
      # The failure is recorded and re-raised by the final gate step, not thrown
      # here: the Pokédex build below has been working and its commit should still
      # go out. Fail the job, not the rest of the pipeline.
      - name: Scrape in-game Champions usage
        id: usage
        run: |
          set +e
          python -u scripts/scrape_champions_usage.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
              git checkout -- data/champions_usage.json 2>/dev/null
              echo "::error::scrape_champions_usage failed (exit $rc) — kept the committed champions_usage.json, which is now a day staler. data_guardian escalates once it passes its freshness budget."
              echo "failed=$rc" >> "$GITHUB_OUTPUT"
          else
              echo "failed=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # Rebuild the Pokédex (also writes data/champions_names_de.json from the
      # committed German name sources). Fail-soft: keeps committed JSON.
      - name: Build Champions Pokédex
        run: |
          set +e
          python -u scripts/build_champions_pokedex.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
              echo "::warning::build_champions_pokedex exited with $rc — pokedex JSON kept as-is"
              git checkout -- data/champions_pokedex.json data/champions_names_de.json 2>/dev/null
          fi
          exit 0

      # No bump here. deploy-pages.yml rewrites ?v=, APP_VERSION, the service
      # worker CACHE_NAME, version.json and the _formatWindow snapshot inside
      # _site/ on every deploy (its "Cache-bust asset references" step), so the
      # stamp a data job commits never reaches a user. All it did was put
      # index.html (845 KB), service-worker.js and version.json into ~147
      # commits a month and churn the service worker's CACHE_NAME, which makes
      # the activate handler drop every client cache several times a day.

      - name: Commit + push
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/champions_usage.json \
                  data/champions_pokedex.json \
                  data/champions_names_de.json
          if git diff --cached --quiet; then
            echo "No usage/pokedex changes — skipping push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: champions-usage refresh — ${ts}

          Triggered by .github/workflows/champions-usage-refresh.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # --autostash: avoid "cannot pull with rebase: You have unstaged
            # changes" when the build leaves unstaged tracked-file edits.
            git pull --rebase=true --autostash -X ours origin main || { git rebase --abort 2>/dev/null || true; exit 1; }
          done
          exit 1

      # No explicit `gh workflow run deploy-pages.yml` here. The push above
      # already triggers deploy-pages (on: push to main), and dispatching a
      # second run put both into `concurrency: pages, cancel-in-progress: true`
      # — one of the two got cancelled, and the wait step could end up watching
      # the loser. One trigger, one deploy.

      # The job is only green if the scrape actually scraped. Runs last so the
      # Pokédex build and its commit still go out on a usage-scrape failure.
      - name: Fail the run if the usage scrape died
        if: steps.usage.outputs.failed != '0'
        run: |
          echo "::error::champions usage scrape exited ${{ steps.usage.outputs.failed }} — data/champions_usage.json was NOT refreshed."
          exit 1
