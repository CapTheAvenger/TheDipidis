# CodeQL security analysis — static code scanning for known vulnerability
# patterns (XSS, SQL injection, prototype pollution, regex DoS, etc.).
#
# Why: complements the runtime CSP + SRI + Firestore-rules defences with
# source-level scanning. CodeQL queries are maintained by GitHub Security
# Lab + community; we get free continuous coverage for our JS surface.
#
# Frequency: every push to main + every PR + a weekly cron (catches
# newly-published queries against unchanged code). Findings land in the
# Security tab on github.com — they don't block merges by default
# (would be too noisy on an audit-in-progress codebase). Once Wave-1
# stabilises we can wire the high-severity ones into a required check.

name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "27 6 * * 1"  # Mondays 06:27 UTC — off-peak

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ "javascript-typescript" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality covers the standard security suite PLUS
          # quality queries (maintainability, complexity). Switch to
          # 'security-extended' if quality noise becomes a problem.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
