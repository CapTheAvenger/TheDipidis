name: Data Guardian

# Daily data-quality watch. It REPORTS and never repairs: this data drives prices
# and card identity, where a guessed correction is worse than a visible hole.
#
# Findings land in a single rolling GitHub issue (created on first finding,
# updated afterwards, closed automatically once everything is clean again), so a
# recurring problem doesn't spam a new issue every morning.
#
# Runs after the daily price refresh (08:00 UTC) so it inspects the day's fresh
# data rather than yesterday's.

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the updated baseline
  issues: write     # open/update the findings issue

concurrency:
  group: data-guardian
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the freshness check reads each data file's last commit
          # date. With fetch-depth 1 there is no history to read (and mtimes are
          # all clone-time), so the check would silently never fire.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run guardian
        id: guard
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python scripts/data_guardian.py --update-baseline 2>&1 | tee /tmp/guardian.log
          # ::error:: / ::warning:: lines are the findings; collect them for the issue body.
          grep -E '^::error::|^::warning::' /tmp/guardian.log \
            | sed -e 's/^::error::/- **CRITICAL** /' -e 's/^::warning::/- WARN /' \
            > /tmp/findings.md || true
          crit=$(grep -c '^::error::' /tmp/guardian.log || true)
          echo "crit=${crit:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit baseline
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/_guardian_baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged."
            exit 0
          fi
          git commit -m "Auto: data guardian baseline — $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase=true --autostash -X ours origin main || exit 1
          done
          echo "::error::Could not push baseline after 3 attempts"; exit 1

      # Ein roter Datenlauf war bisher nur per Mail sichtbar — und Mails gehen
      # unter. Genau das ist im August passiert: "Champions Usage Refresh" war
      # mehrere Tage rot (zu scharfer Schutz in scrape_champions_usage.py, PR
      # #518), ohne dass es jemandem auffiel, und davor liefen 31 Laeufe gruen,
      # waehrend champions_usage.json seit dem 17.07. stillstand.
      #
      # Die Stillstand-Haelfte faengt check_champions_freshness() ab. Die
      # Rot-Haelfte hatte keinen Kanal. Sie bekommt jetzt denselben wie alles
      # andere hier: das eine rollende Issue, das sich von selbst schliesst,
      # sobald wieder alles gruen ist.
      #
      # Nicht ueberwacht: bot-keepalive (alle 5 Minuten, waere nur Rauschen),
      # visual-fullpage (Bildvergleich, keine Daten) und dieser Lauf selbst.
      - name: Datenlaeufe auf Rot pruefen
        id: laeufe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Ohne gh liefert jede Abfrage eine leere Zeile, und die Schleife
          # unten haelt jeden Workflow fuer "noch nie gelaufen" — die Pruefung
          # meldete dann stumm alles gruen, ohne etwas geprueft zu haben.
          # Genau die Bauart, die diesen Waechter noetig gemacht hat. Also
          # zuerst nachsehen, und den Ausfall als Befund melden statt als
          # Schweigen. Kein exit 1: die Meldung danach soll trotzdem laufen,
          # sonst verschluckt dieser Schritt die Funde des Guardians mit.
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh steht auf dem Runner nicht zur Verfuegung — die Laufkontrolle hat NICHTS geprueft."
            echo "- **CRITICAL** Laufkontrolle uebersprungen: \`gh\` fehlt auf dem Runner. Der Status der Datenlaeufe ist damit unbekannt, nicht gruen." >> /tmp/findings.md
            echo "rot=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Alle geplanten Laeufe, deren Scheitern bedeutet, dass die Seite
          # veraltete oder falsche Daten ausliefert.
          WORKFLOWS="
            champions-replica-scrape.yml
            champions-usage-refresh.yml
            daily-price-refresh.yml
            weekly-full-update.yml
            per-decklist-scrape.yml
            verify-cardmarket-mapping.yml
            cardmarket-card-images.yml
            prizepack-official-images.yml
            pocket-tierlist.yml
          "
          rot=0
          for wf in $WORKFLOWS; do
            zeile=$(gh run list --workflow "$wf" --branch main --limit 1 \
                      --json conclusion,status,createdAt,url \
                      --jq '.[0] | [.conclusion, .status, .createdAt, .url] | @tsv' 2>/dev/null)
            if [ -z "$zeile" ]; then
              echo "  $wf — noch kein Lauf auf main, uebersprungen"
              continue
            fi
            schluss=$(printf '%s' "$zeile" | cut -f1)
            status=$(printf  '%s' "$zeile" | cut -f2)
            wann=$(printf    '%s' "$zeile" | cut -f3)
            url=$(printf     '%s' "$zeile" | cut -f4)
            # Ein Lauf ohne Ergebnis laeuft noch. Das ist kein Befund.
            if [ "$status" != "completed" ]; then
              echo "  $wf — laeuft noch ($status)"
              continue
            fi
            case "$schluss" in
              success|skipped)
                echo "  $wf — $schluss"
                ;;
              cancelled)
                echo "::warning::$wf: letzter Lauf wurde abgebrochen ($wann) — $url"
                echo "- WARN \`$wf\`: letzter Lauf abgebrochen ($wann) — [Lauf ansehen]($url)" >> /tmp/findings.md
                ;;
              *)
                echo "::error::$wf: letzter Lauf ist $schluss ($wann) — $url"
                echo "- **CRITICAL** \`$wf\`: letzter Lauf auf main ist **$schluss** ($wann) — [Lauf ansehen]($url)" >> /tmp/findings.md
                rot=$((rot + 1))
                ;;
            esac
          done
          echo "rot=$rot" >> "$GITHUB_OUTPUT"

      - name: Report findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CRIT: ${{ steps.guard.outputs.crit }}
          ROT: ${{ steps.laeufe.outputs.rot }}
        run: |
          TITLE="🛡️ Data guardian: findings"
          # Reuse one rolling issue instead of opening a new one every morning.
          NUM=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/repos/$REPO/issues?state=open&per_page=100" \
               | T="$TITLE" python3 -c "import sys,json,os;t=os.environ['T'];print(next((i['number'] for i in json.load(sys.stdin) if i['title']==t),''))")

          if [ "$(( ${CRIT:-0} + ${ROT:-0} ))" = "0" ]; then
            if [ -n "$NUM" ]; then
              echo "All clear — closing issue #$NUM"
              curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/issues/$NUM" \
                -d "$(python3 -c 'import json;print(json.dumps({"state":"closed"}))')" >/dev/null
            else
              echo "All clear — nothing to report."
            fi
            exit 0
          fi

          {
            echo "The daily data guardian found issues. **Nothing was auto-corrected** —"
            echo "this data drives prices and card identity, so holes are reported rather"
            echo "than guessed at."
            echo
            cat /tmp/findings.md
            echo
            echo "Run: $RUN_URL"
            echo
            echo "See \`data/_consumers.md\` for the consumer contract these checks protect."
          } > /tmp/body.md

          if [ -n "$NUM" ]; then
            echo "Updating issue #$NUM"
            curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/issues/$NUM" \
              -d "$(python3 -c 'import json;print(json.dumps({"body":open("/tmp/body.md",encoding="utf-8").read()}))')" >/dev/null
          else
            echo "Opening new issue"
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/issues" \
              -d "$(T="$TITLE" python3 -c 'import json,os;print(json.dumps({"title":os.environ["T"],"body":open("/tmp/body.md",encoding="utf-8").read()}))')" >/dev/null
          fi
