name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Pages deploys are idempotent and only the latest commit's artifact
  # matters. Cancelling an in-flight run when a newer push lands shortens
  # the hot-fix latency window without losing anything — the abandoned
  # build would have been overwritten anyway. Was `false` historically;
  # 2026-06-12 audit flagged it as unnecessary serialisation.
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Install JS test dependencies
        run: npm install --no-save papaparse

      - name: Run JS unit tests
        run: |
          TOTAL_PASS=0
          TOTAL_FAIL=0
          for f in tests/unit/test-*.js; do
            OUTPUT=$(node --test "$f" 2>&1) || true
            PASS=$(echo "$OUTPUT" | grep -oP '# pass \K\d+' || echo 0)
            FAIL=$(echo "$OUTPUT" | grep -oP '# fail \K\d+' || echo 0)
            TOTAL_PASS=$((TOTAL_PASS + PASS))
            TOTAL_FAIL=$((TOTAL_FAIL + FAIL))
            if [ "$FAIL" -gt 0 ]; then
              echo "::error::$f — $FAIL test(s) failed"
              echo "$OUTPUT"
            fi
          done
          echo "✓ JS tests: $TOTAL_PASS passed, $TOTAL_FAIL failed"
          if [ "$TOTAL_FAIL" -gt 0 ]; then
            echo "::error::$TOTAL_FAIL JS test(s) failed — blocking deployment"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          pip install pytest beautifulsoup4 requests lxml

      - name: Run Python unit tests
        run: |
          set +e
          python -m pytest tests/python/ -q --tb=short 2>&1
          PYTEST_EXIT=$?
          set -e

          if [ "$PYTEST_EXIT" -eq 0 ]; then
            echo "✓ Python tests passed"
          elif [ "$PYTEST_EXIT" -eq 5 ]; then
            echo "::warning::No Python tests were collected in tests/python - continuing"
          else
            echo "::error::Python tests failed with exit code $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js with cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Validate Python syntax
        run: |
          python3 -m py_compile backend/core/card_scraper_shared.py
          python3 -m py_compile backend/scrapers/city_league_analysis_scraper.py
          python3 -m py_compile backend/scrapers/current_meta_analysis_scraper.py
          echo "✓ All Python files pass syntax check"

      - name: Install npm tools
        run: npm install -g terser clean-css-cli html-minifier-terser

      - name: Validate JS syntax
        run: |
          shopt -s nullglob
          for f in js/*.js; do
            terser "$f" --no-module -o /dev/null 2>/dev/null || { echo "::error::Syntax error in $f"; exit 1; }
          done
          echo "✓ All JS files pass syntax check"

      - name: Inject Firebase Credentials
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::warning::FIREBASE_CONFIG secret is not set – deploying with placeholder credentials"
          else
            echo "$FIREBASE_CONFIG" > js/firebase-credentials.js
            echo "✓ Firebase credentials injected"
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "window.GOOGLE_CLIENT_ID = \"${GOOGLE_CLIENT_ID}\";" >> js/firebase-credentials.js
            echo "✓ Google Client ID injected"
          else
            echo "::warning::GOOGLE_CLIENT_ID secret is not set – Google Sign-In will be disabled"
          fi

      - name: Inject Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -n "$SENTRY_DSN" ]; then
            sed -i "s|__SENTRY_DSN__|${SENTRY_DSN}|g" js/error-tracking.js
            echo "✓ Sentry DSN injected"
          else
            echo "::warning::SENTRY_DSN secret is not set – error tracking will be disabled"
          fi

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.json _site/
          cp version.json _site/
          cp service-worker.js _site/
          cp .nojekyll _site/
          cp CNAME _site/ 2>/dev/null || true
          cp -r css _site/css
          cp -r js _site/js
          cp -r images _site/images 2>/dev/null || true
          cp -r data _site/data
          cp pokemon_sets_mapping.csv _site/ 2>/dev/null || true
          mkdir -p _site/config
          cp config/current_meta_analysis_settings.json _site/config/ 2>/dev/null || true
          cp _config.yml _site/ 2>/dev/null || true

      - name: Minify JS, CSS & HTML
        run: |
          shopt -s nullglob
          for f in _site/js/*.js; do
            terser "$f" --compress --mangle -o "${f}.min" && mv "${f}.min" "$f" || { echo "::error::Minification failed for $f"; exit 1; }
          done
          for f in _site/css/*.css; do
            cleancss -o "${f}.min" "$f" && mv "${f}.min" "$f" || { echo "::error::CSS minification failed for $f"; exit 1; }
          done
          html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true -o _site/index.html _site/index.html || echo "::warning::HTML minification skipped"
          echo "✓ Minification complete"

      - name: Optimize images
        run: |
          sudo apt-get install -y -qq optipng > /dev/null 2>&1
          find _site/images -name '*.png' -exec optipng -o2 -quiet {} + 2>/dev/null || true
          echo "✓ Image optimization complete"

      - name: Cache-bust asset references
        run: |
          # Use commit hash + timestamp so every deploy has a unique version,
          # even when the same commit is re-deployed via workflow_dispatch.
          HASH=$(git rev-parse --short HEAD)
          STAMP=$(date -u +%Y%m%d%H%M)
          VER="${STAMP}-${HASH}"

          # 1) Asset query strings (?v=...) in HTML and JS
          sed -i "s/\?v=[^\"]*/\?v=${VER}/g" _site/index.html
          for f in _site/js/*.js; do
            sed -i "s/\?v=[^'\"]*/\?v=${VER}/g" "$f"
          done

          # 2) Embedded APP_VERSION in index.html — drives the version-check
          #    that purges caches + force-reloads stale clients on next visit.
          #    Regex tolerates both quote styles + post-minification spacing.
          sed -i -E "s/(window\.APP_VERSION[[:space:]]*=[[:space:]]*)['\"][^'\"]*['\"]/\1\"${VER}\"/g" _site/index.html

          # 3) Service Worker CACHE_NAME — forces a new SW install on every
          #    deploy, so the activate handler clears old caches and signals
          #    open tabs to reload.
          sed -i -E "s/(CACHE_NAME[[:space:]]*=[[:space:]]*)['\"][^'\"]*['\"]/\1'tcg-analysis-v${VER}'/g" _site/service-worker.js
          sed -i -E "s|// v[0-9A-Za-z._-]+|// v${VER}|" _site/service-worker.js

          # 4) version.json — fetched network-only on every page load and
          #    compared against APP_VERSION. Mismatch triggers the auto-purge.
          printf '{"version":"%s"}' "${VER}" > _site/version.json

          # 5) window._formatWindow snapshot — sync the rotation-defining
          #    fields from data/format_window.json into the inline script
          #    so JS modules don't fall back to a stale literal like
          #    'TEF-POR'. Single source of truth = the JSON file.
          if [ -f _site/data/format_window.json ]; then
            CS=$(python3 -c "import json; print(json.load(open('_site/data/format_window.json')).get('current_set',''))" 2>/dev/null || echo "")
            OLS=$(python3 -c "import json; print(json.load(open('_site/data/format_window.json')).get('oldest_legal_set',''))" 2>/dev/null || echo "")
            CSJP=$(python3 -c "import json; print(json.load(open('_site/data/format_window.json')).get('current_set_jp',''))" 2>/dev/null || echo "")
            if [ -n "$CS" ];   then sed -i -E "s/(current_set:[[:space:]]*)['\"][^'\"]*['\"]/\\1'${CS}'/"   _site/index.html; fi
            if [ -n "$OLS" ];  then sed -i -E "s/(oldest_legal_set:[[:space:]]*)['\"][^'\"]*['\"]/\\1'${OLS}'/" _site/index.html; fi
            if [ -n "$CSJP" ]; then sed -i -E "s/(current_set_jp:[[:space:]]*)['\"][^'\"]*['\"]/\\1'${CSJP}'/" _site/index.html; fi
            echo "  _formatWindow  {current_set:${CS}, oldest_legal_set:${OLS}, current_set_jp:${CSJP}}"
          fi

          # 6) data/offline-manifest.json — list every data file the
          #    offline prefetcher should pull into the SW cache. Sizes
          #    are fresh from disk so the progress UI is accurate.
          #    Extracted to scripts/generate-offline-manifest.py because
          #    a heredoc'd python block here would break the YAML
          #    block-scalar indentation (lines at column 0 terminate
          #    the `run: |` block).
          python3 scripts/generate-offline-manifest.py _site/data "${VER}"

          # 7) data/bot-deck-index.json — per-archetype stock decklists
          #    consumed by the Telegram bot's Deck Builder flow.
          #    Cheaper than driving Puppeteer per-deck on Render Free.
          python3 scripts/generate-bot-deck-index.py _site "${VER}"

          # 8) data/card-art/*.png — pre-fetched + resized card tiles
          #    that the bot's deck-image composite reads at request
          #    time. Doing this here keeps the bot off the Limitless
          #    CDN entirely (no rate-limit risk, same-origin caching).
          pip install --quiet Pillow requests
          python3 scripts/prefetch-card-art.py _site

          echo "✓ Cache-busted with version ${VER}"
          echo "  index.html  APP_VERSION = ${VER}"
          echo "  service-worker.js  CACHE_NAME = tcg-analysis-v${VER}"
          echo "  version.json  ${VER}"

      - name: Set up Node for prerender
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Pre-render Meta Call snapshot for the Telegram bot
        # Renders the dashboard PNG into _site/data/meta-call-snapshot.png
        # so https://thedipidis.app/data/meta-call-snapshot.png serves it
        # after deploy. The bot fetches that static URL — ~1 s response
        # instead of 40 s of live Puppeteer per request.
        # The Ubuntu runner ships with google-chrome-stable installed,
        # so we point Puppeteer at it and skip the 280 MB download.
        # `npm ci` now that prerender/package-lock.json is committed
        # (AUDIT_GITHUB.md F-19) — deterministic resolution + audit
        # without the post-hoc `npm i --package-lock-only` shuffle.
        working-directory: prerender
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: |
          npm ci --no-audit --no-fund --omit=optional
          node prerender-meta-call.js ../_site

      - name: Run cross-surface consistency tests against the built artifacts
        # The bot-deck-index.json only exists after generate-bot-deck-index.py
        # ran a few steps above, so cross-surface tests have to run here
        # (the earlier pytest step in the test job runs against the
        # un-built data/ tree and skips these). Failure here aborts the
        # deploy via the workflow's job-level failure: better to keep
        # the previously deployed Pages live than push inconsistent
        # data to the CDN.
        env:
          # The cross-surface tests look up bot-deck-index.json under
          # DATA_DIR which defaults to data/. Override so the suite
          # finds the freshly-built artifact in _site/data/ instead.
          DATA_DIR: ${{ github.workspace }}/_site/data
        run: |
          pip install --quiet pytest
          python -m pytest tests/python/test_cross_surface_consistency.py -v --tb=short

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
