name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Third-party action inventory (audit baseline, wave-0 HF-9):
#   actions/checkout@v4          — supply-chain critical (has GITHUB_TOKEN access)
#   actions/setup-node@v4
#   actions/setup-python@v5
#   actions/upload-artifact@v4
#   actions/configure-pages@v5
#   actions/upload-pages-artifact@v3
#   actions/deploy-pages@v4      — supply-chain critical (signs Pages deploy)
#
# TODO (wave-1 / phase-B): SHA-pin every uses: line with the commit hash
# of the current tagged release, e.g.
#   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
# and let Renovate or Dependabot keep them current. This protects against
# the tj-actions/changed-files compromise pattern (CVE-2025-30066) where
# the attacker rewrote the v45 tag to point at malicious code.
# Reason this isn't done in wave-0: requires GitHub-API access to fetch
# the SHA for each tagged release, which the audit sandbox doesn't allow.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (warn-only in phase A)
        run: |
          # ESLint is informational until Phase B (modularization). The
          # config emits no errors today; warnings are logged for visibility.
          npm run lint --silent || true
          echo "✓ Lint pass complete (warnings are advisory)"

      - name: TypeScript typecheck (wave-1 L2.1 pilot files)
        run: |
          # tsc --noEmit on the wave-1-L2.1 pilot files (see tsconfig.json
          # 'include'). The codebase is still .js — this is JSDoc-driven
          # type-checking, no compilation, no runtime change. As more
          # modules opt in via '// @ts-check' they get added to tsconfig
          # and start failing the build on type errors.
          npm run typecheck --silent
          echo "✓ Typecheck pass complete"

      - name: Run JS unit tests
        run: |
          npm test --silent

      - name: Test coverage (advisory, baseline for phase B)
        run: |
          # c8 reports ~0% today because the unit tests load production code
          # via vm.Script + extractFunction() (see tests/unit/test-helpers.js).
          # That instrumentation pattern is invisible to c8. We still emit
          # the report so the artifact pipeline + thresholds are wired up
          # for the day tests become real require()-based modules (phase B).
          npm run test:coverage --silent 2>&1 | tail -20 || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build wave-1 bundle (artifact-only, not yet shipped)
        run: |
          # Wave-1 Layer-1: concatenate ~34 defer-loaded js/*.js scripts
          # into a single _dist/app.bundle.js with source map. The bundle
          # is NOT yet referenced from index.html — this step just
          # produces it so we can validate the artefact in CI before the
          # later HTML cut-over swaps the 34 <script> tags for one.
          npm run build:bundle
          ls -la _dist/

      - name: Upload wave-1 bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-1-bundle
          path: _dist/
          retention-days: 14
          if-no-files-found: error

      - name: NPM dependency audit (warn-only)
        run: |
          # Surfacing CVEs in our devDeps without failing the build —
          # we'll tighten this to --audit-level=high once Phase A is done.
          npm audit --omit=dev --audit-level=high 2>&1 | tee npm-audit.log || true
          echo "✓ npm audit complete (advisory)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          pip install pytest beautifulsoup4 requests lxml pip-audit

      - name: Python dependency audit (warn-only)
        run: |
          # pip-audit on requirements.txt — non-blocking in phase A.
          # We use --strict only after we've reviewed the current baseline.
          pip-audit -r requirements.txt 2>&1 | tee pip-audit.log || true
          echo "✓ pip-audit complete (advisory)"

      - name: Run Python unit tests
        run: |
          set +e
          python -m pytest tests/python/ -q --tb=short \
            --ignore=tests/python/test_price_proxy_and_price_scraper.py \
            2>&1
          PYTEST_EXIT=$?
          set -e

          if [ "$PYTEST_EXIT" -eq 0 ]; then
            echo "✓ Python tests passed"
          elif [ "$PYTEST_EXIT" -eq 5 ]; then
            echo "::warning::No Python tests were collected in tests/python - continuing"
          else
            echo "::error::Python tests failed with exit code $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Python syntax
        run: |
          python3 -m py_compile backend/core/card_scraper_shared.py
          python3 -m py_compile backend/scrapers/city_league_analysis_scraper.py
          python3 -m py_compile backend/scrapers/current_meta_analysis_scraper.py
          echo "✓ All Python files pass syntax check"

      - name: Install npm tools
        run: npm install -g terser clean-css-cli html-minifier-terser

      - name: Validate JS syntax
        run: |
          shopt -s nullglob
          for f in js/*.js; do
            terser "$f" --no-module -o /dev/null 2>/dev/null || { echo "::error::Syntax error in $f"; exit 1; }
          done
          echo "✓ All JS files pass syntax check"

      - name: Inject Firebase Credentials
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::warning::FIREBASE_CONFIG secret is not set – deploying with placeholder credentials"
          else
            echo "$FIREBASE_CONFIG" > js/firebase-credentials.js
            echo "✓ Firebase credentials injected"
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "window.GOOGLE_CLIENT_ID = \"${GOOGLE_CLIENT_ID}\";" >> js/firebase-credentials.js
            echo "✓ Google Client ID injected"
          else
            echo "::warning::GOOGLE_CLIENT_ID secret is not set – Google Sign-In will be disabled"
          fi

      - name: Inject Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -n "$SENTRY_DSN" ]; then
            sed -i "s|__SENTRY_DSN__|${SENTRY_DSN}|g" js/error-tracking.js
            echo "✓ Sentry DSN injected"
          else
            echo "::warning::SENTRY_DSN secret is not set – error tracking will be disabled"
          fi

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.json _site/
          cp version.json _site/
          cp service-worker.js _site/
          cp .nojekyll _site/
          cp CNAME _site/ 2>/dev/null || true
          cp -r css _site/css
          cp -r js _site/js
          cp -r images _site/images 2>/dev/null || true
          cp -r data _site/data
          cp pokemon_sets_mapping.csv _site/ 2>/dev/null || true
          mkdir -p _site/config
          cp config/current_meta_analysis_settings.json _site/config/ 2>/dev/null || true
          cp _config.yml _site/ 2>/dev/null || true

      - name: Build production bundle + swap HTML to single <script> (wave-1 L1.4)
        run: |
          # 1) Build the bundle from the (already-patched, SENTRY-DSN-injected)
          #    source tree. Source files include firebase-config.js etc.
          npm run build:bundle

          # 2) Copy bundle + source-map into _site/js/ so the deployed HTML
          #    can reference js/app.bundle.js relative to the site root. The
          #    minify step that follows will minify it like any other JS file.
          cp _dist/app.bundle.js _site/js/
          cp _dist/app.bundle.js.map _site/js/

          # 3) Swap 34 individual <script> tags in _site/index.html for one
          #    bundle <script>, AND rewrite _site/service-worker.js SHELL_ASSETS
          #    to pre-cache the bundle instead of 34 files. The swap script
          #    inserts the bundle tag at the LAST removed position so it runs
          #    after firebase-credentials.js + the 3 CDN libs (Chart/Papa/
          #    localforage) that some bundled code depends on.
          node scripts/swap-html-to-bundle.js _site

          # 4) Quick post-swap sanity: verify no <script src="js/app-*.js"
          #    survived (they should ALL have been folded into the bundle).
          if grep -E '<script\s+src="js/(app-utils|i18n|firebase-config|firebase-globals|app-core|app-meta-call|firebase-collection)\.js' _site/index.html >/dev/null; then
            echo "::error::Bundle swap left individual <script> tags behind in _site/index.html"
            grep -n '<script\s+src="js/' _site/index.html
            exit 1
          fi
          echo "✓ Wave-1 bundle deployed: js/app.bundle.js replaces 34 individual <script> tags"

      - name: Strip dev-only CSP hosts (wave-0 HF-7)
        run: |
          # Remove http://localhost:8001 from the Production CSP. It's the
          # local price-proxy used by developers; in production it just
          # gives any same-origin XSS payload another exfil channel, and
          # lets any third-party page that a user has open trigger the
          # proxy with the user's IP (B-24).
          sed -i -E 's| http://localhost:8001||g' _site/index.html
          # Verify it's gone
          if grep -q 'localhost:8001' _site/index.html; then
            echo "::error::localhost:8001 still present in _site/index.html"
            exit 1
          fi
          echo "✓ Dev-only CSP hosts stripped from production index.html"

      - name: Inject SRI hashes for CDN scripts (wave-0 HF-6)
        run: |
          # Fetches every CDN script referenced in index.html, computes its
          # SHA-384, and writes integrity="sha384-..." crossorigin="anonymous"
          # into the <script>/<link> tags. Protects against jsDelivr / cdnjs
          # account compromise (Check Point reported jsDelivr abuse for
          # phishing in 2024). Runs in the deploy-time tree (_site/) so any
          # CDN hash drift fails the build instead of shipping silently.
          chmod +x scripts/generate-sri.sh
          ./scripts/generate-sri.sh _site/index.html
          echo "✓ SRI hashes injected into _site/index.html"

      - name: Minify JS, CSS & HTML
        run: |
          shopt -s nullglob
          # drop_console removes console.log/info/debug/warn calls from the
          # production bundle (phase-a-2). console.error is kept on purpose —
          # we still want production stack traces in DevTools + Sentry.
          # pure_funcs lists exactly which console.* methods to drop, so
          # 'error' is preserved.
          #
          # --source-map (wave-0 HF-18) emits foo.js.map alongside foo.js so
          # Sentry can map minified frames back to source. The maps are
          # deployed publicly with the bundle — they don't leak more than
          # the original JS would.  Phase-B will add `sentry-cli sourcemaps
          # upload` here so Sentry serves them directly and we can mark them
          # private; for now we ship them alongside the bundle so the
          # error-tracking.js envelope (which already carries the release
          # tag as of HF-18) has something to resolve against.
          TERSER_COMPRESS='drop_debugger=true,pure_funcs=[console.log,console.info,console.debug,console.warn]'
          for f in _site/js/*.js; do
            terser "$f" \
              --compress "$TERSER_COMPRESS" \
              --mangle \
              --source-map "url='$(basename "$f").map'" \
              -o "${f}.min" \
              && mv "${f}.min" "$f" \
              && mv "${f}.min.map" "${f}.map" 2>/dev/null \
              || { echo "::error::Minification failed for $f"; exit 1; }
          done
          for f in _site/css/*.css; do
            cleancss -o "${f}.min" "$f" && mv "${f}.min" "$f" || { echo "::error::CSS minification failed for $f"; exit 1; }
          done
          html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true -o _site/index.html _site/index.html || echo "::warning::HTML minification skipped"
          echo "✓ Minification complete (console.log/info/debug/warn stripped; error preserved)"

      - name: Optimize images
        run: |
          sudo apt-get install -y -qq optipng > /dev/null 2>&1
          find _site/images -name '*.png' -exec optipng -o2 -quiet {} + 2>/dev/null || true
          echo "✓ Image optimization complete"

      - name: Cache-bust asset references
        run: |
          # Use commit hash + timestamp so every deploy has a unique version,
          # even when the same commit is re-deployed via workflow_dispatch.
          HASH=$(git rev-parse --short HEAD)
          STAMP=$(date -u +%Y%m%d%H%M)
          VER="${STAMP}-${HASH}"

          # 1) Asset query strings (?v=...) in HTML and JS
          sed -i "s/\?v=[^\"]*/\?v=${VER}/g" _site/index.html
          for f in _site/js/*.js; do
            sed -i "s/\?v=[^'\"]*/\?v=${VER}/g" "$f"
          done

          # 2) Embedded APP_VERSION in index.html — drives the version-check
          #    that purges caches + force-reloads stale clients on next visit.
          #    Regex tolerates both quote styles + post-minification spacing.
          sed -i -E "s/(window\.APP_VERSION[[:space:]]*=[[:space:]]*)['\"][^'\"]*['\"]/\1\"${VER}\"/g" _site/index.html

          # 3) Service Worker CACHE_NAME — forces a new SW install on every
          #    deploy, so the activate handler clears old caches and signals
          #    open tabs to reload.
          sed -i -E "s/(CACHE_NAME[[:space:]]*=[[:space:]]*)['\"][^'\"]*['\"]/\1'tcg-analysis-v${VER}'/g" _site/service-worker.js
          sed -i -E "s|// v[0-9A-Za-z._-]+|// v${VER}|" _site/service-worker.js

          # 4) version.json — fetched network-only on every page load and
          #    compared against APP_VERSION. Mismatch triggers the auto-purge.
          printf '{"version":"%s"}' "${VER}" > _site/version.json

          echo "✓ Cache-busted with version ${VER}"
          echo "  index.html  APP_VERSION = ${VER}"
          echo "  service-worker.js  CACHE_NAME = tcg-analysis-v${VER}"
          echo "  version.json  ${VER}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
