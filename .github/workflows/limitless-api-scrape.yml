name: Limitless-API-Lauf

# Holt Online-Turnierdaten ueber die OFFIZIELLE Limitless-API
# (https://docs.limitlesstcg.com/developer) statt aus gerendertem HTML.
#
# WARUM ES DIESEN LAUF GIBT
# -------------------------
# Der bisherige Weg zog nur die erfolgreichen Listen (`max_lists_per_deck: 20`,
# Median 3 Archetypen je Turnier). Damit waren Kartenschnitte ueber das
# ganze Feld, Matchup-Matrizen und Anteile mit belastbarem Nenner nicht
# baubar. Die API liefert pro Turnier JEDEN Spieler mit vollstaendiger
# Deckliste und JEDES Match mit Sieger — geprueft am 08.09.2026 an
# "Pumpkaweekly": 342 von 342 Spielern mit Liste, 876 Matches.
#
# WARUM ER IN CI SEIN MUSS
# ------------------------
# play.limitlesstcg.com ist aus dem Bausandkasten nicht erreichbar
# (Egress-Proxy, 403) und auch nicht vom Rechner des Betreibers aus.
# Der Rechenteil des Scrapers ist netzfrei und wird von
# tests/python/test_limitless_api_scraper.py geprueft (14 Zusicherungen,
# 10 von 10 Mutationen gefangen). Ob die API dieselbe Semantik behaelt,
# kann nur dieser Lauf beantworten — dafuer ist `gegenprobe` da.
#
# TEMPO
# -----
# Zwei bis drei Anfragen JE TURNIER, nicht je Archetyp. Gemessen am
# 08.09.2026: 86 Turniere in sieben Tagen, davon 26 mit >= 100 Spielern
# (4.457 von 5.622 Spielern, 79 %). Ein Wochenlauf sind damit rund
# 54 Anfragen. Der HTML-Weg haette 806 bis 3.250 gekostet.
#
# ZEITPLAN: TAEGLICH, seit dem 08.09.2026
# --------------------------------------
# Die Bedingung "erst ein gruener Lauf von Hand, dann ein cron" ist
# erfuellt: fuenf Laeufe von Hand, alle gruen, 396 Turniere geschrieben,
# kein einziges 429. Der laengste (186 Turniere in voller Tiefe) lief
# 26 min 24 s.
#
# WARUM TAEGLICH UND NICHT ZWEIMAL DIE WOCHE
# Gemessen am 08.09.2026: 26 Turniere je Woche ab 100 Spielern, zwei bis
# drei Anfragen je Turnier — rund 8 Anfragen pro Tag. Dieselbe Wochenlast
# wie ein Mi/Fr-Rhythmus, nur gleichmaessig verteilt statt in zwei
# Bloecken, und die Daten sind nie aelter als 24 Stunden. Die
# Meta-Transition-Analyse liest Wochenverlaeufe; zwei Messpunkte je Woche
# machen daraus eine gezackte Linie ohne Not.
#
# 03:40 UTC liegt zwischen dem Champions-Lauf (04:00) und dem
# Preis-Lauf (08:00) — kein Gedraenge auf denselben Laeufern.
#
# `tage: 3` statt 14: der Lauf ist inkrementell, ein Fenster von drei
# Tagen deckt jede Luecke ab, die ein ausgefallener Lauf reissen kann,
# und spart 20 der 30 Listenabrufe.
#
# Anstoss von Hand: GitHub -> Actions -> Limitless-API-Lauf -> Run workflow

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      gegenprobe:
        description: 'Nur die Live-Gegenprobe fahren (nichts schreiben)'
        type: boolean
        default: true
      mindest_spieler:
        description: 'Turniere mit weniger Teilnehmern ueberspringen'
        type: string
        default: '100'
      tage:
        description: 'Wie weit zurueck die Turnierliste gelesen wird'
        type: string
        default: '14'
      tiefe:
        description: 'voll = alle vier Ebenen (3 Anfragen/Turnier) · archetypen = nur Anteil und Bilanz (1 Anfrage, ~6 KB statt ~200 KB)'
        type: choice
        options: ['voll', 'archetypen']
        default: 'voll'
      meta:
        description: 'Nur diese Formatfenster, komma-getrennt (z. B. TEF-CRI,TEF-POR). Leer = alle im Zeitraum'
        type: string
        default: ''
      turniere:
        description: 'Hoechstens N Turniere holen (0 = alle offenen)'
        type: string
        default: '5'
      trocken:
        description: 'Nur berichten, welche Turniere offen sind'
        type: boolean
        default: false

permissions:
  contents: write
  actions:  write   # for the deploy-pages dispatch

concurrency:
  group: limitless-api-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # Der Scraper braucht nur die Standardbibliothek (urllib, csv, json).
      # requirements.txt wird trotzdem installiert, damit ein spaeterer
      # Ausbau nicht an einer fehlenden Abhaengigkeit scheitert.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ZUERST die Gegenprobe, IMMER — auch vor einem Schreiblauf.
      # Wenn die API ihre Semantik aendert (etwa Doppelniederlagen anders
      # zaehlt), schreibt der Lauf sonst stillschweigend falsche Bilanzen
      # in vier Dateien. Dieser Schritt darf hart umfallen.
      - name: Gegenprobe gegen live abgelesene Werte
        env:
          # OPTIONAL. Ist das Geheimnis nicht gesetzt, ist die Variable
          # leer und der Scraper laeuft ohne Schluessel — genau wie
          # bisher. Der Wert geht als Header raus, nie als Teil einer URL:
          # URLs landen im Protokoll dieses Laufs.
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
        run: |
          python backend/scrapers/limitless_api_scraper.py --verify 2>&1 | tee /tmp/verify.log
          rc=${PIPESTATUS[0]}
          {
            echo "### Gegenprobe"
            echo ""
            echo '```'
            cat /tmp/verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            echo "::error::Die Limitless-API liefert nicht mehr, was am 08.09.2026 gemessen wurde. Es wird nichts geschrieben."
            exit $rc
          fi

      # Beim Zeitplanlauf ist `inputs.gegenprobe` leer, nicht true — der
      # Schritt laeuft also. Genau so soll es sein: der naechtliche Lauf
      # faehrt erst die Gegenprobe (Schritt davor, immer) und schreibt
      # dann.
      - name: Turnierdaten holen
        if: ${{ inputs.gegenprobe != true }}
        env:
          # Beim Zeitplanlauf sind alle inputs leer — dann greifen die
          # Vorgaben dahinter. Ohne sie liefe der naechtliche Lauf mit
          # `--min-players` ohne Wert und braeche mit einem Argumentfehler
          # ab; ein Zeitplan, der jede Nacht rot meldet, wird nach drei
          # Nächten nicht mehr gelesen.
          MINDEST_SPIELER: ${{ inputs.mindest_spieler || '100' }}
          TAGE: ${{ inputs.tage || '3' }}
          TURNIERE: ${{ inputs.turniere || '0' }}
          TROCKEN: ${{ inputs.trocken }}
          TIEFE: ${{ inputs.tiefe || 'voll' }}
          META: ${{ inputs.meta }}
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
        run: |
          set +e
          args="--min-players $MINDEST_SPIELER --days $TAGE --max-tournaments $TURNIERE"
          if [ -n "$TIEFE" ]; then args="$args --tiefe $TIEFE"; fi
          if [ -n "$META" ]; then args="$args --meta $META"; fi
          if [ "$TROCKEN" = "true" ]; then args="$args --dry-run"; fi

          vorher=0
          if [ -f data/online_api_tournaments.csv ]; then
            vorher=$(( $(wc -l < data/online_api_tournaments.csv) - 1 ))
          fi

          python backend/scrapers/limitless_api_scraper.py $args 2>&1 | tee /tmp/api.log
          rc=${PIPESTATUS[0]}

          zeilen() { if [ -f "$1" ]; then echo $(( $(wc -l < "$1") - 1 )); else echo 0; fi; }
          {
            echo "### Limitless-API-Lauf"
            echo ""
            echo "| Datei | Zeilen | Groesse |"
            echo "| --- | ---: | ---: |"
            echo "| online_api_tournaments.csv | $(zeilen data/online_api_tournaments.csv) (vorher $vorher) | $(du -h data/online_api_tournaments.csv 2>/dev/null | cut -f1) |"
            echo "| online_api_archetypes.csv | $(zeilen data/online_api_archetypes.csv) | $(du -h data/online_api_archetypes.csv 2>/dev/null | cut -f1) |"
            # Karten und Matchups liegen je Formatfenster in eigenen Dateien.
            # Die Groesse steht mit dabei: 146 KB je Turnier heisst, dass eine
            # Datei ueber ein ganzes Format 27 MB erreicht, und ab 50 MB warnt
            # GitHub. Wer den Lauf ansieht, soll das sehen, bevor es eng wird.
            for f in data/online_api_cards_*.csv data/online_api_matchups_*.csv; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | $(zeilen "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Rueckgabewert: \`$rc\` · Argumente: \`$args\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Wie bei online-decklists.yml: dieser Lauf startet auf
          # Knopfdruck, also sieht genau ein Mensch hin. Ein gruener Haken
          # ueber einem Abbruch belaegt ihn.
          if [ $rc -ne 0 ]; then
            echo "::error::Limitless-API-Lauf abgebrochen (Code $rc) — siehe Protokoll oben"
            exit $rc
          fi

      # WARUM DIESER SCHRITT HIER STEHT UND NICHT NUR IM WOCHENLAUF
      # -----------------------------------------------------------
      # build_data_stand.py schreibt den Stand einer Datei nur fort, wenn
      # der LAUFENDE Job sie angefasst hat (`geaendert()` liest
      # `git status --porcelain`). Der Wochenlauf fasst die vier
      # API-Dateien nie an — sie stuenden dort also fuer immer in
      # "ohne_stand", also: "diese Datei fuehren wir, wissen aber nichts
      # ueber sie". Gemessen am 08.09.2026 auf der Live-Seite: nach dem
      # ersten Datenlauf tauchte `online_api` in data_stand.json an KEINER
      # Stelle auf, weder mit Datum noch als Luecke.
      #
      # Der Stand gehoert dorthin, wo er entsteht — genau die Begruendung,
      # die schon im Wochenlauf ueber demselben Aufruf steht.
      # Die Prognose sitzt auf den Daten, die der Schritt davor geholt hat.
      # Sie laeuft auch im Gegenprobe-Modus NICHT — dort wird nichts
      # geschrieben, und eine Prognose aus unveraenderten Daten waere nur
      # ein neuer Zeitstempel auf derselben Zahl.
      - name: Meta-Prognose rechnen
        if: ${{ success() && inputs.gegenprobe != true && inputs.trocken != true }}
        run: |
          python3 scripts/build_meta_prognose.py 2>&1 | tee /tmp/prognose.log
          rc=${PIPESTATUS[0]}
          {
            echo "### Meta-Prognose"
            echo ""
            echo '```'
            cat /tmp/prognose.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            echo "::error::Meta-Prognose gescheitert (Code $rc)"
            exit $rc
          fi

      # ── Die Masterclass-Aufbereitung nachziehen (23.09.2026) ─────
      #
      # BEFUND: masterclass/mega-stalobor.de.html traegt je Matchup drei
      # Zahlen aus genau den CSVs, die dieser Lauf schreibt. Sie sind am
      # 21.09.2026 von Hand hineingerechnet worden, und niemand hat sie
      # nachgezogen. Am 23.09.2026 standen im Stueck 52 Partien gegen
      # Dragapult, in der Datei 66 — sechzehn Zellen auseinander, und
      # tests/python/test_masterclass_kartennamen.py hat den Deploy
      # angehalten. Zu Recht: eine Zahl im Stueck, die nicht in den Daten
      # steht, ist eine Behauptung.
      #
      # Der Schritt gehoert HIERHIN, weil hier die Eingabe entsteht. Er
      # laeuft NACH dem Scrape und VOR dem Commit, sonst schreibt er in
      # den Vortagesstand. Fail-soft: faellt er um, bleibt das Stueck
      # stehen — dann ist es dateiert, nicht falsch, und die Zusicherung
      # meldet es beim naechsten Deploy.
      - name: Masterclass-Zahlen nachziehen
        if: ${{ success() && inputs.gegenprobe != true && inputs.trocken != true }}
        run: |
          set +e
          python3 -u scripts/masterclass_zahlen_nachziehen.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::masterclass_zahlen_nachziehen exited with $rc — Stueck bleibt wie es ist"
          fi
          exit 0

      - name: Datenstaende fortschreiben
        if: ${{ success() && inputs.gegenprobe != true && inputs.trocken != true }}
        run: python3 scripts/build_data_stand.py

      - name: Commit + push
        id: commit
        if: ${{ success() && inputs.gegenprobe != true && inputs.trocken != true }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          # data_stand.json MUSS mit: ohne sie waere der Schritt darueber
          # wirkungslos — die Datei wuerde im Laeufer erzeugt und mit ihm
          # verworfen.
          # Die Chunkdateien per Glob — mit jeder Rotation kommt eine dazu,
          # und eine Datei, die niemand in diese Liste nachtraegt, wird im
          # Laeufer erzeugt und mit ihm verworfen.
          git add data/online_api_tournaments.csv \
                  data/online_api_archetypes.csv \
                  data/data_stand.json \
                  data/meta_prognose.json
          git add data/online_api_cards_*.csv data/online_api_matchups_*.csv 2>/dev/null || true
          # Das Stueck aus dem Schritt "Masterclass-Zahlen nachziehen".
          # Ohne diese Zeile waere der Schritt wirkungslos — dieselbe
          # Falle, die data/champions_move_flags.json sieben Tage lang
          # weggeworfen hat (23.09.2026).
          git add masterclass/mega-stalobor.de.html 2>/dev/null || true
          # Die alten flachen Dateien sind in die Chunks uebergegangen.
          # 09.09.2026: die beiden ungeteilten Dateien gibt es nicht mehr —
          # der Lauf schreibt seit dem Umbau nur noch Auszuege je
          # Formatfenster (online_api_cards_TEF-PBL.csv etc.), und die
          # werden oben ueber den Glob erfasst. Die Zeile lief durch
          # `|| true` still ins Leere und las sich, als wuerde hier etwas
          # gesichert.
          if git diff --cached --quiet; then
            echo "unveraendert — kein Push."
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: Limitless-API — ${ts}

          Quelle: play.limitlesstcg.com/api (offizielle API, ganzes Feld)
          Triggered by .github/workflows/limitless-api-scrape.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && break
            sleep $((i * 5))
          done
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push $i fehlgeschlagen — neu aufsetzen und erneut"
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          echo "::error::Push nach drei Versuchen fehlgeschlagen"
          exit 1

      # Ein Push mit dem GITHUB_TOKEN loest `on: push` NICHT aus
      # (Rekursionsschutz von GitHub Actions); ohne diese Zeile veraltet
      # die Seite still. tests/python/test_deploy_dispatch.py haelt das fest.
      - name: Deploy anstossen (GITHUB_TOKEN-Push triggert ihn nicht)
        if: ${{ success() && steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
