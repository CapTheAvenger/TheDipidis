name: Per-Decklist Scrape

# Per-decklist scraper — preserves per-(tournament × player × card)
# resolution that the existing aggregated pipeline collapses into
# archetype-level averages. Output: data/tournament_decklists_per_player.csv
#
# Three trigger modes:
#   1. workflow_dispatch (manual) — pass a single tournament_id OR
#      a from_tournament_id threshold for backfills.
#   2. schedule cron (Tuesday post-weekly-run) — incremental refresh
#      via --resume so only NEW tournaments get fetched.
#
# Network cost: 1 fetch per tournament page + 1 fetch per UNIQUE
# decklist (multiple players with identical lists cache to 1 fetch).
# Typical Regional: 1 + ~150 fetches × 1.0 s delay = ~2.5 min.
# Backfill of 8 TEF-POR + TEF-CRI tournaments: ~25-40 min worst case.

on:
  workflow_dispatch:
    inputs:
      tournament_id:
        description: 'Limitless 3-digit tournament ID (blank = scrape all known via JH state)'
        type: string
        default: ''
      from_date:
        description: 'Backfill from this date forward (YYYY-MM-DD). Default "auto" reads in_person_legal_date from format_window.json so the scrape stays pinned to the current format. Pass an explicit date for broader backfills; pass "" to disable.'
        type: string
        default: 'auto'
      meta:
        description: 'Comma-separated meta codes (e.g. TEF-POR,TEF-CRI). Blank = no meta filter — date filter still applies.'
        type: string
        default: ''
      from_tournament_id:
        description: 'Backfill from this tournament ID upwards (blank = no floor)'
        type: string
        default: ''
      resume:
        description: 'Skip tournaments already in tournament_decklists_per_player.csv'
        type: boolean
        default: true
      max_tournaments:
        description: 'Stop after N tournaments (0 = unlimited)'
        type: string
        default: '0'
  schedule:
    # 12:00 UTC Tuesday — runs ~6 h after the weekly full update so the
    # JH scraper has already discovered the week's new tournaments.
    - cron: '0 12 * * 2'

permissions:
  contents: write
  actions:  write

concurrency:
  group: per-decklist-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 6 hours — accommodates a worst-case full TEF-POR + TEF-CRI backfill
    # (~12 tournaments × ~10 min each in degraded-network conditions). The
    # default --from-date 2026-04-01 caps the work to ~12 tournaments;
    # without that filter the 109-tournament historical set blew past
    # 90 min on the 2026-06-09 first attempt.
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The scraper reads tournament_jh_scraped.json (and the cards CSVs
      # for the labs-tid resolver). Seed backend/core/data/ before run.
      #
      # CRITICAL: also seed all_cards_database.csv — the shared
      # extract_cards_from_decklist_soup() helper resolves Trainer /
      # Energy cards via CardDatabaseLookup.get_latest_low_rarity_version().
      # Without the DB, ALL trainers + energies silently get dropped (only
      # Pokémon survive because their HTML has explicit /cards/<set>/<num>
      # hrefs). The 2026-06-09 first backfill hit this: top finishers'
      # 60-card decks ended up as ~10 Pokémon each, no trainers, no
      # energies. CardDatabaseLookup loads both the CSV (preferred) and
      # the JSON; we seed both so either path works.
      - name: Seed backend/core/data/ from data/
        run: |
          mkdir -p backend/core/data
          for f in tournament_jh_scraped.json \
                   tournament_cards_data_overview.csv \
                   labs_tournament_id_overrides.json \
                   labs_tournament_decks.csv \
                   tournament_decklists_per_player.csv \
                   player_continuity.csv \
                   all_cards_database.csv \
                   all_cards_database.json \
                   japanese_cards_database.csv \
                   sets.json \
                   format_window.json; do
            if [ -f "data/$f" ]; then
              cp "data/$f" "backend/core/data/$f"
            fi
          done
          # Seed per-meta cards files for the labs-tid name lookup
          shopt -s nullglob
          for f in data/tournament_cards_data_cards_*.csv; do
            cp "$f" "backend/core/data/$(basename "$f")"
          done
          # Per-meta labs CSVs — required for _build_labs_id_lookup to
          # resolve (tournament_name + date → labs 4-digit tid). Without
          # them, the labs-tid column ends up empty in every output row,
          # which breaks the join with player_continuity.csv that the
          # frontend uses to find the "best successful list".
          # (2026-06-09 first backfill missed all 10 mappings because
          # of this gap.)
          for f in data/labs_tournament_decks_*.csv; do
            cp "$f" "backend/core/data/$(basename "$f")"
          done
          shopt -u nullglob

      - name: Run per-decklist scraper
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        run: |
          set +e
          echo "::group::scrapers/per_decklist_scraper.py"
          ARGS=""
          if [ -n "${{ github.event.inputs.tournament_id }}" ]; then
              ARGS="$ARGS --tournament-id ${{ github.event.inputs.tournament_id }}"
          fi
          # Schedule runs use "auto" — the scraper reads
          # in_person_legal_date from format_window.json so the cron
          # iteration is auto-pinned to the current format. Without
          # this, every format rotation would leave the previous
          # rotation's data piling up in the output CSV (the
          # 2026-06 rotation accumulated 48 k stale TEF-POR rows
          # before this fix). Manual runs honour whatever the
          # maintainer typed; pass an explicit date to backfill
          # broader windows.
          if [ "${{ github.event_name }}" = "schedule" ]; then
              ARGS="$ARGS --from-date auto --resume"
          else
              if [ -n "${{ github.event.inputs.from_date }}" ]; then
                  ARGS="$ARGS --from-date ${{ github.event.inputs.from_date }}"
              fi
              if [ -n "${{ github.event.inputs.meta }}" ]; then
                  ARGS="$ARGS --meta ${{ github.event.inputs.meta }}"
              fi
              if [ -n "${{ github.event.inputs.from_tournament_id }}" ]; then
                  ARGS="$ARGS --from-tournament-id ${{ github.event.inputs.from_tournament_id }}"
              fi
              if [ "${{ github.event.inputs.resume }}" = "true" ]; then
                  ARGS="$ARGS --resume"
              fi
              if [ -n "${{ github.event.inputs.max_tournaments }}" ] && [ "${{ github.event.inputs.max_tournaments }}" != "0" ]; then
                  ARGS="$ARGS --max-tournaments ${{ github.event.inputs.max_tournaments }}"
              fi
          fi
          echo "Running with args: $ARGS"
          python backend/scrapers/per_decklist_scraper.py $ARGS
          rc=$?
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
              echo "::warning::per_decklist_scraper exited with $rc"
          fi
          exit 0  # never block — partial data is still data

      - name: Copy output back to data/
        run: |
          if [ -f backend/core/data/tournament_decklists_per_player.csv ]; then
            cp backend/core/data/tournament_decklists_per_player.csv \
               data/tournament_decklists_per_player.csv
            wc -l data/tournament_decklists_per_player.csv
          fi

      - name: Bump version
        run: |
          chmod +x bump-version.sh
          ./bump-version.sh

      - name: Commit + push
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/tournament_decklists_per_player.csv \
                  index.html service-worker.js version.json
          if git diff --cached --quiet; then
            echo "No changes — skipping push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: per-decklist scrape — ${ts}

          Triggered by .github/workflows/per-decklist-scrape.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase=true -X ours origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      # No explicit deploy dispatch. The push above already triggers
      # deploy-pages (on: push to main); dispatching a second run put both into
      # `concurrency: pages, cancel-in-progress: true`, so one of the two was
      # cancelled and the deploy could end up watching or reporting the loser.
      # One push, one deploy.
