name: Player Continuity Scrape

# Manual-trigger workflow for the player-continuity scraper.
# Fetches labs.limitlesstcg.com/<tid>/standings for every tournament in
# labs_tournaments.json and writes per-(tournament × player × deck) rows
# to data/player_continuity.csv. Runs in CI rather than locally because
# Limitless gates non-CI IPs with a Cloudflare 403 (cloudscraper handles
# it inside the Actions runner network range).
#
# Trigger: GitHub UI → Actions → Player Continuity Scrape → Run workflow

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Only scrape tournaments dated >= this ISO date (blank = all)'
        type: string
        default: '2026-04-01'
      resume:
        description: 'Skip tids already in player_continuity.csv'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: player-continuity-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The scraper reads labs_tournaments.json + labs_tournament_decks.csv
      # from backend/core/data/ (legacy data_dir resolution in
      # card_scraper_shared.get_data_dir). Seed both before running.
      - name: Seed backend/core/data/ from data/
        run: |
          mkdir -p backend/core/data
          for f in labs_tournaments.json labs_tournament_decks.csv player_continuity.csv; do
            if [ -f "data/$f" ]; then
              cp "data/$f" "backend/core/data/$f"
            fi
          done

      - name: Run player-continuity scraper
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.from_date }}" ]; then
            ARGS="$ARGS --from-date ${{ github.event.inputs.from_date }}"
          fi
          if [ "${{ github.event.inputs.resume }}" = "true" ]; then
            ARGS="$ARGS --resume"
          fi
          python backend/scrapers/player_continuity_scraper.py $ARGS

      # Copy back to the canonical data/ location so the commit step
      # picks it up.
      - name: Copy output back to data/
        run: |
          if [ -f backend/core/data/player_continuity.csv ]; then
            cp backend/core/data/player_continuity.csv data/player_continuity.csv
          fi

      - name: Commit + push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/player_continuity.csv
          if git diff --cached --quiet; then
            echo "No changes to player_continuity.csv — skipping push."
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: player-continuity scrape — ${ts}

          Triggered by .github/workflows/player-continuity-scrape.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            git pull --rebase=true origin main || { git rebase --abort; exit 1; }
          done
          exit 1
