name: Pocket Tier List

# Pokémon TCG Pocket: Tier-Liste und die Decks des aktuellen Sets, je mit
# geprüftem Scan-Code. Schreibt data/pocket_tierlist.json — die Datei, die
# der Pocket-Reiter liest.
#
# WARUM DIESER LAUF IN CI SEIN MUSS
# ---------------------------------
# game8.co und img.game8.co sind aus dem Bausandkasten nicht erreichbar
# (der Egress-Proxy antwortet mit 403). Der Scraper lässt sich dort also
# schreiben und gegen tests/fixtures/ prüfen, aber nicht gegen die echte
# Seite laufen. Genau dafür ist dieser Ablauf da — und für den ersten
# Beweis, dass sich Game8s 2D-Muster überhaupt auslesen lassen.
#
# TEMPO
# -----
# Rund 50 Deck-Seiten plus 50 QR-Bilder, mit 1,2 s Pause dazwischen: gut
# zwei Minuten reine Wartezeit. Das ist Absicht — Game8 schuldet uns
# nichts.
#
# Anstoß: täglich um 05:20 UTC ODER GitHub → Actions → Pocket Tier List
#         → Run workflow

# KEIN ZEITPLAN — UND DAS IST EIN BEFUND, KEINE BEQUEMLICHKEIT
# -----------------------------------------------------------
# Hier stand `cron: '20 5 * * *'`. Drei Läufe am 04.09.2026 haben gezeigt,
# dass er nie etwas liefern kann: Game8 antwortet dem Github-Läufer auf
# JEDEN Weg mit HTTP 202 — Cloudflares "Prüfung läuft".
#
#     cloudscraper: HTTP 202 | curl_cffi: HTTP 202 | requests: HTTP 202
#
# Auch curl_cffi mit Chrome-TLS-Fingerabdruck (chrome120), also das
# Mittel, mit dem sechs andere Scraper dieses Repos durchkommen. Es liegt
# nicht an der Bibliothek, sondern am Rechenzentrums-Adressbereich.
#
# Ein Zeitplan hätte also jede Nacht eine Warnung erzeugt und nie eine
# Zeile Daten. Das ist schlimmer als kein Zeitplan: man gewöhnt sich an
# die Meldung und übersieht die echte.
#
# Woher die Daten stattdessen kommen: aus einer Arbeitssitzung, in der
# game8.co über die Domain-Zulassungsliste erreichbar ist. Das passt zur
# Sache — eine Tier-Liste ändert sich mit dem Set, nicht über Nacht.
#
# Der Ablauf bleibt hier stehen, weil er dann sofort wieder greift, wenn
# Game8 den Läufer eines Tages durchlässt. Ein Probelauf über
# `workflow_dispatch` sagt das in fünfzig Sekunden.

on:
  workflow_dispatch:
    inputs:
      nur:
        description: 'Nur die ersten N Decks (Probelauf; leer = alle)'
        type: string
        default: ''
      trocken:
        description: 'Nichts schreiben, nur berichten'
        type: boolean
        default: false

permissions:
  contents: write
  actions:  write

concurrency:
  group: pocket-tierlist
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pocket tier-list scraper
        env:
          # Über die Umgebung, nicht per ${{ }} in die Shell hinein.
          # Vorher stand `--nur ${{ inputs.nur }}` direkt in der
          # Befehlszeile: was jemand ins Actions-Feld tippt, lief damit
          # als Shell-Text mit (dritte Abnahme, 04.09.2026).
          NUR: ${{ inputs.nur }}
          TROCKEN: ${{ inputs.trocken }}
        run: |
          set +e
          args=""
          if [ -n "$NUR" ]; then args="$args --nur $NUR"; fi
          if [ "$TROCKEN" = "true" ]; then args="$args --trocken"; fi
          # NICHT in ::group:: — eine zugeklappte Gruppe ist der falsche
          # Ort für einen Abbruch. Vorher verschwand der Rückfall
          # ("keine Set-Tabelle gefunden") in einer zugeklappten Gruppe
          # und im Protokoll stand nur "Scraper endete mit 1".
          python scripts/scrape_pocket_tierlist.py $args 2>&1 | tee /tmp/pocket.log
          rc=${PIPESTATUS[0]}

          # WARUM DIESER SCHRITT JETZT ROT WERDEN DARF
          # -----------------------------------------
          # Hier stand `exit 0` mit der Begründung, ein Fehlschlag sei
          # ein Befund und kein Grund für eine Mailflut. Das galt, solange
          # der Ablauf jede Nacht lief. Er läuft jetzt nur noch auf
          # Knopfdruck (siehe oben) — dann ist genau EIN Mensch da, der
          # das Ergebnis sehen will, und ein grüner Haken über einem
          # Abbruch belügt ihn.
          #
          # Konkret neutralisierte das `exit 0` die harten Abbrüche im
          # Skript: fehlende Set-Tabelle, Quote unter zwei Dritteln,
          # Rechnung geht nicht auf. Alle drei sind dafür gebaut, dass
          # jemand hinsieht.
          if [ $rc -ne 0 ]; then
            letzte="$(grep -m1 '::error::' /tmp/pocket.log | sed 's/^::error:://' || true)"
            echo "::error::Pocket-Scraper abgebrochen (Code $rc): ${letzte:-siehe Protokoll oben}"
            exit $rc
          fi

      - name: Commit + push
        id: commit
        # `success() &&` ist hier nicht überflüssig: ein eigenes `if:`
        # ersetzt die sonst stillschweigende Bedingung success(). Ohne
        # das würde nach einem Abbruch des Scrapers trotzdem committet —
        # genau das, was die Abbrüche verhindern sollen.
        if: ${{ success() && inputs.trocken != true }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ ! -f data/pocket_tierlist.json ]; then
            echo "keine Ausgabe — nichts zu committen"
            exit 0
          fi
          git add data/pocket_tierlist.json
          if git diff --cached --quiet; then
            echo "unverändert — kein Push."
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: Pocket-Tier-Liste — ${ts}

          Quelle: game8.co (redaktionelle Einstufung)
          Triggered by .github/workflows/pocket-tierlist.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && break
            sleep $((i * 5))
          done
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push $i fehlgeschlagen — neu aufsetzen und erneut"
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          echo "::error::Push nach drei Versuchen fehlgeschlagen"
          exit 1

      # Ohne diesen Schritt veraltet die Seite still: ein Push mit dem
      # GITHUB_TOKEN loest `on: push` NICHT aus (Rekursionsschutz von
      # GitHub Actions). Dieselbe Zeile steht in jedem Datenlauf, der
      # nach main pusst; tests/python/test_deploy_dispatch.py haelt das
      # fest.
      #
      # `if` bindet den Deploy an Laeufe, die wirklich etwas gepusht
      # haben — sonst stiesse jeder unveraenderte Tageslauf einen Deploy
      # an, der nichts ausliefert.
      - name: Deploy anstossen (GITHUB_TOKEN-Push triggert ihn nicht)
        if: ${{ success() && steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
