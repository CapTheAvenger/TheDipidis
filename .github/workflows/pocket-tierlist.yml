name: Pocket Tier List

# Pokémon TCG Pocket: Tier-Liste aus den Ergebnissen der Online-Turniere
# auf Limitless, je Deck mit einer gespielten Liste und ihrem Scan-Code.
# Schreibt data/pocket_tierlist.json — die Datei, die der Pocket-Reiter
# liest — und den Zwischenstand data/pocket_limitless_turniere.json.
#
# SEIT 29.09.2026 TAEGLICH UND OHNE HANDGRIFF
# -------------------------------------------
# Bis heute holte dieser Ablauf Game8s Tier-Liste. Game8 antwortet dem
# GitHub-Laeufer auf jedem Weg mit HTTP 202 (Cloudflare; gemessen 04.09.
# und 26.09.2026), also lief die Ernte als woechentliche Handaufgabe.
# Entscheidung Hausi, 29.09.2026: „wichtig ist nur, dass wir auf Dauer
# nichts mehr manuell machen muessen" — Quelle wechseln.
#
# Die neue Quelle ist die API von play.limitlesstcg.com. Derselbe Host
# wird von limitless-api-scrape.yml seit Wochen taeglich aus CI
# abgefragt (gruen). Die Sandkiste erreicht ihn nicht (403 am Proxy),
# deshalb laeuft der Abruf nur hier.
#
# REIHENFOLGE
# -----------
#   1. Kennungstabelle (data/pocket_karten_ids.json) aus der
#      Kartendatenbank auf GitHub erneuern — ein neues Set bringt neue
#      Karten, und ohne ihre Kennung gibt es fuer ein Deck keinen Code.
#   2. Set-Namen (data/pocket_sets.json) aus derselben Datenbank.
#   3. Die Tier-Liste.
#   4. Das Tor, dann der Push.
# 1 und 2 duerfen scheitern (die alte Tabelle bleibt), 3 nicht.
#
# ZWEIG
# -----
# Gepusht wird auf den Zweig, von dem aus der Lauf startet. Geplant ist
# das `main`; per workflow_dispatch auf einem PR-Zweig landet der Stand
# dort (CLAUDE.md: „Ein Arbeitsablauf, der Dateien holt, gehoert auf den
# ZWEIG"). Der Deploy wird nur fuer `main` angestossen.
#
# Anstoß: täglich um 05:20 UTC ODER GitHub → Actions → Pocket Tier List
#         → Run workflow

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      trocken:
        description: 'Nichts schreiben, nur berichten'
        type: boolean
        default: false

permissions:
  contents: write
  actions:  write

concurrency:
  group: pocket-tierlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    # +15 min fuer das Tor vor dem Push (Kern-Suiten ~6,5 min im Deploy-Test, 29.09.2026)
    timeout-minutes: 35

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Neu ist erlaubt, verloren nicht: verschwindet eine bekannte Karte
      # aus der Quelle oder aendert sich ihre Kennung, bricht das Skript ab
      # und die alte Tabelle bleibt stehen. Die Tier-Liste laeuft trotzdem —
      # Decks mit Karten, die die Tabelle nicht kennt, stehen dann ohne Code
      # und mit Grund da.
      - name: Kennungstabelle erneuern
        continue-on-error: true
        run: python3 scripts/build_pocket_karten_ids.py

      # Die Set-Namen gehoeren in denselben Lauf: ein neues Set bringt neue
      # Decks UND eine neue Kennung mit. Faellt die Quelle aus, bleibt in der
      # Oberflaeche die blanke Kennung stehen.
      - name: Set-Namen fortschreiben
        continue-on-error: true
        run: python3 scripts/build_pocket_sets.py

      - name: Tier-Liste aus Limitless
        env:
          # Ueber die Umgebung, nicht per ${{ }} in die Shell hinein
          # (dritte Abnahme, 04.09.2026).
          TROCKEN: ${{ inputs.trocken }}
        run: |
          args=""
          if [ "$TROCKEN" = "true" ]; then args="--trocken"; fi
          python scripts/scrape_pocket_limitless.py $args

      # DEN DATENSTAND VOR DEM COMMIT FORTSCHREIBEN (12.09.2026) —
      # build_data_stand.py schreibt nur fort, was dieser Lauf angefasst hat.
      - name: Datenstaende fortschreiben
        run: python3 scripts/build_data_stand.py

      # DAS TOR VOR DEM PUSH (29.09.2026) — scripts/tor_vor_dem_push.sh.
      # Bereich `alle`: dieser Ablauf schreibt Pocket-Daten, also prueft er
      # Kern UND tests/nebenbereiche.
      - name: Node fuer das Tor
        if: ${{ success() && inputs.trocken != true }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Tor vor dem Push
        id: tor
        if: ${{ success() && inputs.trocken != true }}
        run: bash scripts/tor_vor_dem_push.sh alle

      # TOR-PROTOKOLLE SICHERN (SC-29, 09.10.2026): nach einem Zurueckrollen zeigt
      # das Schrittprotokoll nur den zweiten Durchlauf; erstlauf/*.log und
      # rollback/neu/ (die frische Fassung jeder zurueckgerollten Datei) liegen nur
      # hier. Nur wenn es etwas zu lesen gibt: Tor rot oder Datei zurueckgerollt.
      - name: Tor-Protokolle sichern
        if: ${{ always() && (steps.tor.outcome == 'failure' || steps.tor.outputs.rollback != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tor-${{ github.run_id }}
          path: ${{ runner.temp }}/tor
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit + push
        id: commit
        # `success() &&`: ein eigenes `if:` ersetzt die stille Bedingung
        # success(). Ohne das wuerde nach einem Abbruch trotzdem committet.
        if: ${{ success() && inputs.trocken != true }}
        env:
          ZWEIG: ${{ github.ref_name }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git add data/pocket_tierlist.json data/pocket_limitless_turniere.json \
                  data/pocket_sets.json data/pocket_karten_ids.json data/data_stand.json
          if git diff --cached --quiet; then
            echo "unverändert — kein Push."
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: Pocket-Tier-Liste — ${ts}

          Quelle: play.limitlesstcg.com (Standings der Pocket-Standardturniere)
          Triggered by .github/workflows/pocket-tierlist.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Push ueber scripts/push_nach_rebase.sh (30.09.2026): im Konflikt gewinnt
          # dieser Lauf, data_stand.json wird neu gebaut, ein Push ohne eigenen
          # Inhalt heisst pushed=false, nach dem Rebase laeuft das Tor noch einmal.
          bash scripts/push_nach_rebase.sh alle

      # Ein Push mit dem GITHUB_TOKEN loest `on: push` NICHT aus
      # (Rekursionsschutz). tests/python/test_deploy_dispatch.py haelt diese
      # Zeile fest. Nur fuer main — ein PR-Zweig wird nicht ausgeliefert.
      - name: Deploy anstossen (GITHUB_TOKEN-Push triggert ihn nicht)
        if: ${{ success() && steps.commit.outputs.pushed == 'true' && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
