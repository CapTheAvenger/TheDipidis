# Step 1 of the pokepricelab identity source: build the (set, number) ->
# catalog URL index from their sitemap. Reads the sitemap only — no card
# pages — so the next step fetches just the ~1.5k cards whose Cardmarket
# mapping is still unverified instead of crawling 50k+.
#
# Their robots.txt has no Disallow rules and declares this sitemap; the
# script still paces its requests. The sandbox proxy denies the host, so
# CI is the only place this can run.
name: Pokepricelab catalog index

# SC-12 (02.10.2026): der Abruf laeuft in ETAPPEN. pokepricelab.com antwortet
# zeitweise ~27 s je Teil-Sitemap, an einem Stueck reichen 120 min nicht. Jeder
# Lauf holt, was in sein Zeitbudget passt, merkt sich die fertigen Teile im
# Actions-Cache (.cache/) und setzt beim naechsten Lauf fort. Geschrieben und
# gepusht wird erst bei vollstaendigem Satz (steps.bau.outputs.schreiben).
# Ein fertiger Index gilt 6 Tage; taeglich ein Lauf ist dann ein
# Minutenlauf ohne Abruf. Steht ein Satz laenger als 5 Tage offen, wird
# der Lauf rot (Skript, ::error::).
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokepricelab-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    # 271 sub-sitemaps at ~0.6s pace is ~3 min of waiting, but the files
    # are large and the first run hit the 30-min wall — give it room.
    # 30.09.2026: gemessen #2 50 min, #3 22 min, #4 nach 60 min abgebrochen
    # (nur der Sitemap-Abruf, danach kommen noch Tor und Push, ~8 min).
    # Die Dauer haengt an der Antwortzeit von pokepricelab.com, nicht an uns.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Der Stand der letzten Etappe. Schluessel je Lauf neu, der juengste
      # vorherige wird wiederhergestellt; gespeichert wird am Ende des Jobs.
      - name: Stand der letzten Etappe
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: pokepricelab-sitemap-${{ github.run_id }}
          restore-keys: pokepricelab-sitemap-

      - name: Build catalog index
        id: bau
        run: python scripts/build_pokepricelab_index.py --budget-min 85

      # DEN DATENSTAND VOR DEM COMMIT FORTSCHREIBEN (12.09.2026)
      #
      # `build_data_stand.py` schreibt den Stand einer Datei nur fort,
      # wenn der LAUFENDE Job sie angefasst hat (`geaendert()` liest
      # `git status --porcelain`). Faellt der Schritt hier weg, commitet
      # der Job neue Daten und laesst `data/_datenstand.json` auf dem
      # alten Datum stehen — die Seite schreibt dann ein Datum an die
      # Zahlen, das nicht zu ihnen gehoert.
      #
      # Gefunden am 12.09.2026: `test_datenstand_abdeckung.py` war auf
      # `main` rot, weil `price_data.csv` im Stand den 11.09. trug und
      # im Git-Verlauf den 12.09. 14 von 17 Ablaeufen, die nach data/
      # commiten, fehlte dieser Schritt.
      - name: Datenstaende fortschreiben
        if: steps.bau.outputs.schreiben == 'true'
        run: python3 scripts/build_data_stand.py

      # DAS TOR VOR DEM PUSH (30.09.2026) — scripts/tor_vor_dem_push.sh.
      # Auch handgestartete Schreiber pruefen vor dem Push.
      - name: Node fuer das Tor
        if: steps.bau.outputs.schreiben == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Tor vor dem Push
        id: tor
        if: steps.bau.outputs.schreiben == 'true'
        run: bash scripts/tor_vor_dem_push.sh kern

      # TOR-PROTOKOLLE SICHERN (SC-29, 09.10.2026): nach einem Zurueckrollen zeigt
      # das Schrittprotokoll nur den zweiten Durchlauf; erstlauf/*.log und
      # rollback/neu/ (die frische Fassung jeder zurueckgerollten Datei) liegen nur
      # hier. Nur wenn es etwas zu lesen gibt: Tor rot oder Datei zurueckgerollt.
      - name: Tor-Protokolle sichern
        if: ${{ always() && steps.bau.outputs.schreiben == 'true' && (steps.tor.outcome == 'failure' || steps.tor.outputs.rollback != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tor-${{ github.run_id }}
          path: ${{ runner.temp }}/tor
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit index
        if: steps.bau.outputs.schreiben == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Schreibweg mit Neuaufsetzen statt Rebase (27.09.2026, Verify #15
          # endete mit Code 128 an einem Konflikt auf data_stand.json):
          # scripts/daten_pushen.sh baut die Datenstaende auf dem neuen Stand neu.
          bash scripts/daten_pushen.sh "Auto: pokepricelab catalog index — $(date -u '+%Y-%m-%d %H:%M UTC')

          Triggered by .github/workflows/pokepricelab-index.yml
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" data/pokepricelab_catalog_index.csv
