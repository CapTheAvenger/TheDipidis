# Step 2 of the pokepricelab identity source: read the Cardmarket
# idProduct off the catalog pages of the cards whose mapping is still
# unverified, and cross-check it against ours.
#
# One request per card (the German base URL), ~760 pages at 1 req/s.
# The script is resumable — a run that hits the wall picks up where it
# stopped, and rows that failed to fetch are retried next time.
#
# It writes a REPORT ONLY. Contradictions are never auto-repaired;
# card identity is not something a scraper gets to decide.
name: Pokepricelab verify

on:
  # ZEITPLAN SEIT 30.09.2026 — Hausi: „ich will eigentlich keine Scraper
  # von Hand starten. Es soll alles automatisch laufen." Donnerstags, weit
  # weg vom Wochenlauf (Di/Fr 06:00) und vom Cardmarket-Pruefer (Mi 04:20).
  # Das Skript setzt fort, wo der letzte Lauf aufgehoert hat; ein Lauf ohne
  # offene Karten schreibt nichts. Der Katalog-Index, aus dem es liest,
  # laeuft noch von Hand (SC-12: pokepricelab.com liefert die Sitemap zur
  # Zeit nicht vollstaendig).
  schedule:
    - cron: '50 2 * * 4'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Check only the first N cards (0 = all). Use e.g. 25 for a smoke run.'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: pokepricelab-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    # 760 pages at 1 s pace is ~13 min; leave room for retries and for a
    # later run that also covers the cards without a base URL.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Cross-check against pokepricelab
        # Im Zeitplan ist inputs.limit leer — dann alle (0).
        run: python scripts/verify_via_pokepricelab.py --limit "${{ inputs.limit || '0' }}"

      # DEN DATENSTAND VOR DEM COMMIT FORTSCHREIBEN (12.09.2026)
      #
      # `build_data_stand.py` schreibt den Stand einer Datei nur fort,
      # wenn der LAUFENDE Job sie angefasst hat (`geaendert()` liest
      # `git status --porcelain`). Faellt der Schritt hier weg, commitet
      # der Job neue Daten und laesst `data/_datenstand.json` auf dem
      # alten Datum stehen — die Seite schreibt dann ein Datum an die
      # Zahlen, das nicht zu ihnen gehoert.
      #
      # Gefunden am 12.09.2026: `test_datenstand_abdeckung.py` war auf
      # `main` rot, weil `price_data.csv` im Stand den 11.09. trug und
      # im Git-Verlauf den 12.09. 14 von 17 Ablaeufen, die nach data/
      # commiten, fehlte dieser Schritt.
      - name: Datenstaende fortschreiben
        run: python3 scripts/build_data_stand.py

      # DAS TOR VOR DEM PUSH (30.09.2026) — scripts/tor_vor_dem_push.sh.
      # Auch handgestartete Schreiber pruefen vor dem Push.
      - name: Node fuer das Tor
        if: always()
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Tor vor dem Push
        id: tor
        if: always()
        run: bash scripts/tor_vor_dem_push.sh kern

      # NUR WENN DAS TOR OFFEN IST (30.09.2026). Hier stand `if: always()`
      # wie beim Tor — damit lief der Commit auch dann, wenn das Tor rot
      # war, und das Tor hielt nichts an. `always()` bleibt, damit ein
      # abgebrochener Abgleich seinen Teilbericht trotzdem sichert.
      - name: Commit report
        if: ${{ always() && steps.tor.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Schreibweg mit Neuaufsetzen statt Rebase (27.09.2026, Verify #15
          # endete mit Code 128 an einem Konflikt auf data_stand.json):
          # scripts/daten_pushen.sh baut die Datenstaende auf dem neuen Stand neu.
          bash scripts/daten_pushen.sh "Auto: pokepricelab identity cross-check — $(date -u '+%Y-%m-%d %H:%M UTC')

          Report only — no mapping was changed.
          Triggered by .github/workflows/pokepricelab-verify.yml
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" data/pokepricelab_verification.csv
