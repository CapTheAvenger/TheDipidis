name: Probe VGCPastes sheet tabs

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sample the Champions M-B tab
        run: |
          python3 - <<'PY'
          import urllib.request, csv, io
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          DOC="1axlwmzPA49rYkqXh7zHvAtSP-TKbM0ijGYBPRflLSWw"
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              return urllib.request.urlopen(req,timeout=40).read().decode("utf-8","replace")
          for label,gid in (("M-B","1458357160"),):
              csv_text=get(f"https://docs.google.com/spreadsheets/d/{DOC}/export?format=csv&gid={gid}")
              rows=list(csv.reader(io.StringIO(csv_text)))
              pastes=csv_text.lower().count("pokepast.es")
              print(f"=== {label} gid {gid}: {len(rows)} rows, {pastes} pokepaste links ===")
              for i,r in enumerate(rows[:12]):
                  print(i, [c[:24] for c in r[:12]])
          PY
