name: Probe VGCPastes sheet tabs

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tinyurl + enumerate spreadsheet tabs
        run: |
          python3 - <<'PY'
          import urllib.request, re
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              r=urllib.request.urlopen(req,timeout=40)
              return r.geturl(), r.read().decode("utf-8","replace")

          # 1) Resolve the Discord-shared tinyurl to the real spreadsheet.
          final,_=get("https://tinyurl.com/vgcpastes2026")
          print("tinyurl resolves to:", final)
          m=re.search(r'/spreadsheets/d/([a-zA-Z0-9-_]+)', final)
          doc_id=m.group(1) if m else None
          print("doc_id:", doc_id)

          # 2) Enumerate tabs of the real doc via the htmlview/pubhtml menu.
          if doc_id:
              for variant in ("htmlview","pubhtml"):
                  try:
                      u=f"https://docs.google.com/spreadsheets/d/{doc_id}/{variant}"
                      fu,html=get(u)
                      print(f"\n=== {variant}: {fu} | bytes {len(html)} ===")
                      # Newer Google menu: items={...} JS, or <a ... gid=...>Name</a>
                      pairs=re.findall(r'\{"name":"([^"]+)"[^}]*?"gid":"?(\d+)', html)
                      if not pairs:
                          pairs=[(n,g) for g,n in re.findall(r'gid=(\d+)[^>]*>([^<]+)<', html)]
                      if not pairs:
                          pairs=[(n,g) for g,n in re.findall(r'sheet-button-(\d+)"[^>]*>(?:<[^>]+>)*([^<]+)', html)]
                      print("TAB pairs (name, gid):")
                      for name,gid in pairs:
                          print("   %-28r gid=%s" % (name, gid))
                      # raw hints
                      for needle in ("Regulation","M-B","MB","gid="):
                          idx=html.find(needle)
                          print("  find %-12r -> %d" % (needle, idx))
                  except Exception as e:
                      print(variant, "ERROR", e)
          PY
