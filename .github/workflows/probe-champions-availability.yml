name: Probe VGCPastes sheet tabs

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List sheet tabs (gid + name) from the published spreadsheet
        run: |
          python3 - <<'PY'
          import urllib.request, re
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          base="https://docs.google.com/spreadsheets/d/e/2PACX-1vTXHOfUSKTZyVoxF7BO-XIEqtbrsq1OSh_4bSaO0bhAMHqtsvYqM_4eZWIMqdZ--SKCb86EXuk75o1i"
          url=base+"/pubhtml"
          req=urllib.request.Request(url,headers=UA)
          html=urllib.request.urlopen(req,timeout=40).read().decode("utf-8","replace")
          print("pubhtml status OK, bytes:", len(html))
          # The tab selector lists each sheet as <li id="sheet-button-<gid>">...>Name</a>
          tabs=re.findall(r'sheet-button-(\d+)"[^>]*>.*?>([^<]+)</a>', html, re.S)
          if not tabs:
              # Fallback: any gid=... with following text
              tabs=re.findall(r'gid=(\d+)[^>]*>\s*([^<]+)', html)
          print("found %d tabs:" % len(tabs))
          for gid,name in tabs:
              print("  gid=%s  name=%r" % (gid, name.strip()))
          # Also dump the raw sheet-menu block so we can see structure if regex missed
          m=re.search(r'<ul id="sheet-menu".*?</ul>', html, re.S)
          print("\n--- raw sheet-menu (first 1500 chars) ---")
          print((m.group(0)[:1500]) if m else "NO sheet-menu found")
          PY
