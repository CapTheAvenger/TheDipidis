name: Probe VGCPastes sheet tabs

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare publish-proxy CSV for M-A vs M-B gid
        run: |
          python3 - <<'PY'
          import urllib.request, csv, io
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          PUB=("https://docs.google.com/spreadsheets/d/e/"
               "2PACX-1vTXHOfUSKTZyVoxF7BO-XIEqtbrsq1OSh_4bSaO0bhAMHqtsvYqM_4eZWIMqdZ--SKCb86EXuk75o1i/"
               "pub?gid={gid}&single=true&output=csv")
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              r=urllib.request.urlopen(req,timeout=40)
              return r.getcode(), r.read().decode("utf-8","replace")
          for label,gid in (("M-A","791705272"),("M-B","1458357160")):
              try:
                  code,txt=get(PUB.format(gid=gid))
                  rows=list(csv.reader(io.StringIO(txt)))
                  pastes=txt.lower().count("pokepast.es")
                  print(f"\n=== publish-proxy {label} gid {gid}: HTTP {code}, {len(rows)} rows, {pastes} pokepastes ===")
                  for i,r in enumerate(rows[:5]):
                      print(i, [c[:22] for c in r[:10]])
              except Exception as e:
                  print(f"\n=== {label} gid {gid}: ERROR {e} ===")
          PY
