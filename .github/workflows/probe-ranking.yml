name: Probe Champions Ranking Source

# TEMPORARY: checks whether championsbattledata exposes an aggregate usage
# ranking (most-used Pokémon per format/season). Output to job log only.
# Delete once the ranking source is decided.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Run ranking probe
        run: python -u scripts/probe_champions_ranking.py
