name: Probe Champions roster sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump full pokebase Champions slug list
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          req=urllib.request.Request("https://pokebase.app/pokemon-champions/pokemon",headers=UA)
          html=urllib.request.urlopen(req,timeout=60).read().decode("utf-8","replace")
          print("bytes:", len(html))
          slugs=sorted(set(re.findall(r'/pokemon-champions/pokemon/([a-z0-9-]+)', html)))
          print("TOTAL slugs:", len(slugs))
          megas=[s for s in slugs if 'mega' in s]
          print("mega-ish slugs (%d): %s" % (len(megas), megas))
          print("FULL_SLUGS=%s" % json.dumps(slugs))
          # Does the page embed structured data (stats/types) we could parse?
          for kw in ['__NEXT_DATA__','application/json','self.__next_f','baseStats','"hp"','"types"','"stats"','data-stats']:
              print("  has", kw, ":", kw in html)
          # Sample any inline JSON-ish around the first slug card
          i=html.find('/pokemon-champions/pokemon/')
          print("slice:", re.sub(r'\s+',' ', html[max(0,i-200):i+300]))
          PY
