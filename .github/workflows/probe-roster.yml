name: Probe Champions roster sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Parse Serebii Champions pokedex table
        run: |
          python3 - <<'PY'
          import urllib.request, re
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          req=urllib.request.Request("https://www.serebii.net/pokemonchampions/pokemon.shtml",headers=UA)
          html=urllib.request.urlopen(req,timeout=40).read().decode("utf-8","replace")
          print("bytes:", len(html))
          # Which pokedex link pattern does Serebii use here?
          for pat in [r'/pokedex-sv/([a-z0-9-]+)\.shtml', r'/pokedex-swsh/([a-z0-9-]+)\.shtml',
                      r'/pokedex-bw/(\d+)\.shtml', r'/pokedex/(\d+)\.shtml',
                      r'href="/pokemon/([a-z0-9-]+)']:
              found=re.findall(pat, html)
              print(f"  pattern {pat!r}: {len(found)} matches; sample {sorted(set(found))[:8]}")
          # Anchor texts (likely the names) within table cells
          anchors=re.findall(r'<a [^>]*href="/pokedex-sv/[^"]+"[^>]*>([^<]+)</a>', html)
          print("\npokedex-sv anchor names:", len(anchors), sorted(set(anchors))[:30])
          # Look at table headers to see columns (stats?)
          hdrs=re.findall(r'<td class="fooevo"[^>]*>(.*?)</td>', html, re.S)[:14]
          print("\nfooevo header-ish cells:", [re.sub('<[^>]+>','',h).strip()[:14] for h in hdrs])
          # raw slice around the first data row
          i=html.find('/pokedex-sv/')
          print("\nraw slice around first pokedex link:")
          print(re.sub(r'\s+',' ', html[max(0,i-400):i+400]))
          PY
