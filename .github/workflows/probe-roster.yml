name: Probe Champions roster sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe pokebase / serebii for a complete Champions roster
        run: |
          python3 - <<'PY'
          import urllib.request, re
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          def get(url):
              try:
                  req=urllib.request.Request(url,headers=UA)
                  r=urllib.request.urlopen(req,timeout=40)
                  return r.getcode(), r.read().decode("utf-8","replace")
              except Exception as e:
                  return None, f"ERR {e}"

          for url in [
              "https://pokebase.app/pokemon-champions/pokemon",
              "https://www.serebii.net/pokemonchampions/",
              "https://www.serebii.net/pokemonchampions/pokemon.shtml",
          ]:
              code,html=get(url)
              print(f"\n========== {url} ==========")
              print("status:", code, "| bytes:", len(html) if isinstance(html,str) else 0)
              if not isinstance(html,str) or code!=200:
                  print(html[:200] if isinstance(html,str) else html); continue
              # Next.js JSON blob?
              nd = "__NEXT_DATA__" in html
              print("__NEXT_DATA__ present:", nd)
              # dex entry links
              links = sorted(set(re.findall(r'/pokemon-champions/pokemon/([a-z0-9-]+)', html)))
              print("pokebase dex slugs:", len(links), links[:25])
              # serebii pokedex links
              dex = sorted(set(re.findall(r'/pokemonchampions/pokemon/(\d+\.shtml)', html)))
              print("serebii pokemon links:", len(dex), dex[:10])
              # any sheet/list anchors mentioning 'pokemon'
              if nd:
                  m=re.search(r'__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
                  blob=m.group(1) if m else ""
                  print("NEXT_DATA bytes:", len(blob))
                  # look for name/baseStats keys
                  for kw in ['"name"','"baseStats"','"types"','"hp"','"slug"','champions']:
                      print("  has", kw, ":", kw in blob)
                  print("NEXT_DATA sample:", blob[:600])
          PY
