name: Probe DE name sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump raw PokeWiki rows for misaligned moves
        run: |
          python3 - <<'PY'
          import urllib.request, json, re
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/124 Safari/537.36"}
          wt=json.loads(urllib.request.urlopen(urllib.request.Request("https://www.pokewiki.de/api.php?action=parse&format=json&prop=wikitext&page=Liste_der_Attackennamen_in_anderen_Sprachen",headers=UA),timeout=30).read().decode("utf-8","replace"))["parse"]["wikitext"]["*"]
          rows=wt.split("\n|-")
          print("total rows:", len(rows))
          print("=== header row (rows[0] tail) ===")
          print(repr(rows[0][-400:]))
          for needle in ["Weather Ball","Electro Shot","Parting Shot","Karate Chop"]:
              print("\n=== raw row containing", needle, "===")
              for r in rows:
                  if needle in r:
                      print(repr(r[:500]))
                      break
          PY
