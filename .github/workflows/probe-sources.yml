name: Probe DE name sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Parse-test (current names) PokeWiki moves + pokemonexperte items
        run: |
          python3 - <<'PY'
          import urllib.request, json, re
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/124 Safari/537.36"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode("utf-8","replace")

          def clean(c):
              c=re.sub(r"\[\[(?:[^|\]]*\|)?([^\]]*)\]\]",r"\1",c)   # [[a|b]]->b
              c=re.sub(r"\{\{[^}]*\}\}","",c)
              c=re.sub(r"<[^>]+>","",c)
              return c

          def current(cell):
              # cells may read "OLD (vor <gen>) NEW (ab <gen>)" — take the
              # current (ab) name; else strip any (vor ...) note.
              cell=clean(cell)
              if "(ab" in cell:
                  pre=cell.split("(ab")[0]
                  cur=pre.split(")")[-1]
                  return cur.strip(" .,\n\t")
              cell=re.sub(r"\(vor[^)]*\)?","",cell)
              return cell.strip(" .,\n\t")

          wt=json.loads(get("https://www.pokewiki.de/api.php?action=parse&format=json&prop=wikitext&page=Liste_der_Attackennamen_in_anderen_Sprachen"))["parse"]["wikitext"]["*"]
          moves={}
          for row in wt.split("\n|-"):
              cells=re.split(r"\|\||\n\|",row)
              cells=[c.lstrip("|") for c in cells if c.strip() and not c.lstrip().startswith("!")]
              cells=[current(c) for c in cells]
              cells=[c for c in cells if c]
              if len(cells)>=2:
                  de,en=cells[0],cells[1]
                  if de and en and len(en)<40 and not de.startswith("{"):
                      moves[en]=de
          print("MOVES parsed:",len(moves))
          for en in ["Hyper Voice","Sucker Punch","Stomping Tantrum","Pound","Double Slap","Wave Crash","Matcha Gotcha","Salt Cure","Bitter Blade","Aqua Step","Close Combat","Protect"]:
              print(f"   {en:18} -> {moves.get(en,'(missing)')}")

          h=get("https://pokemonexperte.de/items/")
          items={}
          for m in re.finditer(r"<li>\s*<a[^>]*>([^<]+)</a>\s*\(([^)]+)\)\s*</li>", h):
              de=m.group(1).strip(); en=m.group(2).strip()
              # de uses windows-1252 mojibake for umlauts in this page; note it
              items[en]=de
          print("\nITEMS parsed:",len(items))
          for en in ["Choice Scarf","Choice Band","Life Orb","Leftovers","Focus Sash","Covert Cloak","Loaded Dice","Clear Amulet"]:
              print(f"   {en:16} -> {items.get(en,'(missing)')}")
          PY
