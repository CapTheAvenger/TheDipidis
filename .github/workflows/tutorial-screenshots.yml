name: Tutorial Screenshots

# Re-generates the 6 PNGs the How-To-Use section embeds at
# /images/tutorials/. Triggered MANUALLY (workflow_dispatch) — the
# screenshots only need to be refreshed when the captured views
# change UI, not on every push.
#
# Outputs:
#   images/tutorials/01-meta-hub.png
#   images/tutorials/02-meta-call.png
#   images/tutorials/03-deck-builder.png
#   images/tutorials/04-cooking-mode.png
#   images/tutorials/05-card-overview.png
#   images/tutorials/06-telegram-bot.png
#
# The job commits the new PNGs back to the source branch so they
# land on Pages with the next deploy. If nothing changed, the
# commit step no-ops.

on:
  workflow_dispatch:
    inputs:
      shots:
        description: 'Comma-separated list of shot numbers (01-06) or "all"'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate tutorial screenshots
        env:
          SHOTS: ${{ inputs.shots }}
        run: node prerender/screenshot-tutorial.js

      # DEN DATENSTAND VOR DEM COMMIT FORTSCHREIBEN (12.09.2026)
      #
      # `build_data_stand.py` schreibt den Stand einer Datei nur fort,
      # wenn der LAUFENDE Job sie angefasst hat (`geaendert()` liest
      # `git status --porcelain`). Faellt der Schritt hier weg, commitet
      # der Job neue Daten und laesst `data/data_stand.json` auf dem
      # alten Datum stehen — die Seite schreibt dann ein Datum an die
      # Zahlen, das nicht zu ihnen gehoert.
      #
      # Gefunden am 12.09.2026: `test_datenstand_abdeckung.py` war auf
      # `main` rot, weil `price_data.csv` im Stand den 11.09. trug und
      # im Git-Verlauf den 12.09. 14 von 17 Ablaeufen, die nach data/
      # commiten, fehlte dieser Schritt.
      - name: Datenstaende fortschreiben
        run: python3 scripts/build_data_stand.py

      - name: Commit new screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Recurse into per-feature subdirs added by the multi-shot
          # script. `git add` of a directory picks up nested PNGs that
          # the old `images/tutorials/*.png` glob missed.
          git add images/tutorials/ data/data_stand.json
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "tutorial: regenerate screenshots (workflow_dispatch)"
            git push
          fi
