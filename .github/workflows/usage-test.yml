name: Test Champions Usage Scrape

# TEMPORARY: runs scrape_champions_usage.py from CI and prints the Pelipper
# record to verify it matches the in-game Doubles analysis before wiring the
# scraper into the daily job. Commits nothing. Delete after verification.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Run usage scraper
        run: python -u scripts/scrape_champions_usage.py
      - name: Verify (Pelipper nature + tail mons captured)
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/champions_usage.json'))
          print("count:", d['_meta']['count'], "season:", d['_meta']['season'])
          pel=d['pokemon'].get('pelipper',{}).get('doubles',{})
          print("Pelipper doubles nature:", pel.get('nature'))
          print("Pelipper doubles top spread:", (pel.get('stat_points') or [{}])[0])
          for slug in ('whimsicott','volcarona','zoroark','weavile','garchomp'):
              p=d['pokemon'].get(slug)
              nat=(p or {}).get('doubles',{}).get('nature',[{}])
              print(f"  {slug}: {'OK' if p else 'MISSING'} top-nature={nat[0].get('name') if nat else None} {nat[0].get('pct') if nat else ''}")
          PY
