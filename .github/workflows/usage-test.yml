name: Test Champions Usage Scrape

# TEMPORARY: verify the derived #1-item percentage matches in-game
# (Pelipper Focus Sash should be ~45.9%). Commits nothing. Delete after.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Run usage scraper
        run: python -u scripts/scrape_champions_usage.py
      - name: Pelipper items (derived Focus Sash vs in-game 45.9%)
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/champions_usage.json'))['pokemon']['pelipper']
          for fmt in ('doubles', 'singles'):
              print(f"\n== {fmt} held_item ==")
              for it in d[fmt].get('held_item', []):
                  flag = ' (derived)' if it.get('derived') else ''
                  print(f"  {it['name']}: {it['pct']}%{flag}")
          # also dump the raw CSV item count to confirm the tail is present
          import urllib.request
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'}
          url='https://championsbattledata.com/pokemon_champions_assets/battle_data/Doubles/Pelipper.csv'
          txt=urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=45).read().decode('utf-8','replace')
          items=[l.split(',') for l in txt.splitlines() if ',held_item,' in l]
          print(f"\nraw CSV held_item rows: {len(items)}")
          for c in items:
              print(f"  rank {c[3]}: {c[4]} = {c[5]!r}")
          PY
