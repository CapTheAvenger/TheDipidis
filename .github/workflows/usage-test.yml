name: Test Champions Usage Scrape

# TEMPORARY: verify whether championsbattledata's per-format column_position
# reproduces the in-game usage ranking (Knakrack #1, Salmagnis #2 …).
# Commits nothing. Delete after verification.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Run usage scraper
        run: python -u scripts/scrape_champions_usage.py
      - name: Top-15 by column_position (vs in-game ranking)
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/champions_usage.json'))['pokemon']
          for fmt in ('doubles', 'singles'):
              rows = [(r[fmt]['pos'], r['name']) for r in d.values()
                      if r.get(fmt) and 'pos' in r[fmt]]
              rows.sort()
              print(f"\n=== {fmt} — top 15 by column_position ===")
              for pos, name in rows[:15]:
                  print(f"  {pos:>3}  {name}")
          PY
