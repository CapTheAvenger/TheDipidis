name: Test Champions Usage Scrape

# TEMPORARY: runs scrape_champions_usage.py from CI and prints the Pelipper
# record to verify it matches the in-game Doubles analysis before wiring the
# scraper into the daily job. Commits nothing. Delete after verification.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Dump Pelipper Doubles raw CSV (find the nature category)
        run: |
          python - <<'PY'
          import urllib.request, collections
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          url="https://championsbattledata.com/pokemon_champions_assets/battle_data/Doubles/Pelipper.csv"
          txt=urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=45).read().decode("utf-8","replace")
          lines=txt.splitlines()
          print("HEADER:",lines[0])
          cats=collections.Counter()
          for ln in lines[1:]:
              c=ln.split(",")
              if len(c)>2: cats[c[2]]+=1
          print("CATEGORIES:",dict(cats))
          print("--- rows whose category is NOT move/held_item/ability/teammate/stat_points ---")
          known={"move","held_item","ability","teammate","stat_points"}
          for ln in lines[1:]:
              c=ln.split(",")
              if len(c)>2 and c[2] not in known:
                  print(ln)
          PY
