# Verify Cardmarket product mappings against the LIVE product pages.
#
# Why: the mapper pairs same-named variants positionally (card number rank
# <-> trend price rank). That swapped OBF 223 <-> 228 (commit #256,
# 2026-06-04) and systematically inverts all 40 SAR-vs-Secret-Rare groups.
# The only external identity source is Limitless' per-print Cardmarket URL;
# this job fetches those pages and records the real idProduct.
#
# Manually dispatched, paced (~2s per page), resumable: each run extends
# data/cardmarket_mapping_verified.csv and commits it. A 403 streak trips
# the circuit breaker (Cardmarket throttling — run again later). The
# sandbox cannot reach cardmarket.com, so CI is the only place this runs.
name: Verify Cardmarket mapping

on:
  # Weekly, unattended: every run picks up rows that are not yet 'verified'
  # (resume state lives in data/cardmarket_mapping_verified.csv), so the
  # unverified set shrinks by itself as prices move apart far enough for
  # the consensus rule to decide. New sets enter the same loop automatically.
  schedule:
    - cron: '20 4 * * 3'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max product pages to fetch this run'
        required: false
        default: '150'
      only_conflicts:
        description: 'Only the proven SAR-vs-Secret-Rare conflict groups (true/false)'
        required: false
        default: 'false'
      recon:
        description: 'Recon mode: dump Limitless price HTML to the log, verify nothing (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: verify-cardmarket-mapping
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Verify mappings against live product pages
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '150' }}"
          # DA-7 (26.09.2026): der Zeitplan lief mit --only-conflicts, und
          # davon gibt es seit dem 01.08. keine mehr — gemessen 26.09.:
          # 0 Konfliktgruppen, 1.388 positionell zugeordnete Zeilen mit
          # Cardmarket-URL, 149 davon nie geprueft (u. a. ganz 30C). Der
          # Lauf tat jede Woche nichts und blieb gruen. Die URL ist die
          # einzige Identitaetsaussage; sie soll ALLE positionellen
          # Zeilen erreichen, nicht nur die Konfliktgruppen.
          if [ "${{ github.event.inputs.only_conflicts || 'false' }}" = "true" ]; then
            ARGS="$ARGS --only-conflicts"
          fi
          if [ "${{ github.event.inputs.recon || 'false' }}" = "true" ]; then
            ARGS="$ARGS --recon"
          fi
          python scripts/verify_cardmarket_mapping.py $ARGS

      # DEN DATENSTAND VOR DEM COMMIT FORTSCHREIBEN (12.09.2026)
      #
      # `build_data_stand.py` schreibt den Stand einer Datei nur fort,
      # wenn der LAUFENDE Job sie angefasst hat (`geaendert()` liest
      # `git status --porcelain`). Faellt der Schritt hier weg, commitet
      # der Job neue Daten und laesst `data/_datenstand.json` auf dem
      # alten Datum stehen — die Seite schreibt dann ein Datum an die
      # Zahlen, das nicht zu ihnen gehoert.
      #
      # Gefunden am 12.09.2026: `test_datenstand_abdeckung.py` war auf
      # `main` rot, weil `price_data.csv` im Stand den 11.09. trug und
      # im Git-Verlauf den 12.09. 14 von 17 Ablaeufen, die nach data/
      # commiten, fehlte dieser Schritt.
      - name: Datenstaende fortschreiben
        run: python3 scripts/build_data_stand.py

      # DAS TOR VOR DEM PUSH (29.09.2026) — scripts/tor_vor_dem_push.sh.
      # Wer nach main schreibt, prueft vorher: faellt hier eine Zusicherung,
      # bricht der Schritt ab, und Commit, Push und Deploy-Anstoss werden
      # uebersprungen. main bleibt gruen, und weder der Deploy noch das Tor
      # des naechsten Wochenlaufs erben den roten Stand.
      - name: Node fuer das Tor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Tor vor dem Push
        id: tor
        run: bash scripts/tor_vor_dem_push.sh kern

      # TOR-PROTOKOLLE SICHERN (SC-29, 09.10.2026): nach einem Zurueckrollen zeigt
      # das Schrittprotokoll nur den zweiten Durchlauf; erstlauf/*.log und
      # rollback/neu/ (die frische Fassung jeder zurueckgerollten Datei) liegen nur
      # hier. Nur wenn es etwas zu lesen gibt: Tor rot oder Datei zurueckgerollt.
      - name: Tor-Protokolle sichern
        if: ${{ always() && (steps.tor.outcome == 'failure' || steps.tor.outputs.rollback != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tor-${{ github.run_id }}
          path: ${{ runner.temp }}/tor
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit verification results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Schreibweg mit Neuaufsetzen statt Rebase (27.09.2026, Verify #15
          # endete mit Code 128 an einem Konflikt auf data_stand.json):
          # scripts/daten_pushen.sh baut die Datenstaende auf dem neuen Stand neu.
          bash scripts/daten_pushen.sh "Auto: cardmarket mapping verification — $(date -u '+%Y-%m-%d %H:%M UTC')

          Triggered by .github/workflows/verify-cardmarket-mapping.yml
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" data/cardmarket_mapping_verified.csv
