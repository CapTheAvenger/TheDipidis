name: Verify Decklist Counts

# Cross-checks our city_league_analysis.csv card counts against the
# Limitless source pages — paginates /cards/<SET>/<NUM>/decklists/jp
# back to the configured start_date and reports the gap per card.
#
# Manual trigger only (this is a verification tool, not part of the
# auto-pipeline). GitHub-hosted runners aren't on Cloudflare's
# datacenter blocklist, so the fetch goes through here even though
# it 403s from the Claude Code sandbox.

on:
  workflow_dispatch:
    inputs:
      card:
        description: 'Single card to verify (format SET/NUM, e.g. MEG/73). Leave empty to use --top instead.'
        required: false
        type: string
      top:
        description: 'Verify the N most-frequent cards in our CSV (ignored if --card is set)'
        required: false
        default: '10'
        type: string
      start_date:
        description: 'Date floor (DD.MM.YYYY). Defaults to start_date from city_league_analysis_settings.json.'
        required: false
        type: string
      max_pages:
        description: 'Safety cap on pagination per card (default 20)'
        required: false
        default: '20'
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4 lxml requests

      - name: Run verify script
        id: verify
        run: |
          mkdir -p /tmp/verify
          args=()
          if [ -n "${{ inputs.card }}" ]; then
            args+=(--card "${{ inputs.card }}")
          else
            args+=(--top "${{ inputs.top }}")
          fi
          if [ -n "${{ inputs.start_date }}" ]; then
            args+=(--start-date "${{ inputs.start_date }}")
          fi
          args+=(--max-pages "${{ inputs.max_pages }}")
          args+=(--json-out /tmp/verify/report.json)

          python backend/tools/verify_card_decklist_counts.py "${args[@]}" | tee /tmp/verify/stdout.txt

      - name: Render job summary
        if: always()
        run: |
          {
            echo '## Decklist Verification Report'
            echo ''
            if [ -f /tmp/verify/report.json ]; then
              echo '| Card | Limitless | Our CSV | Gap | Pages | Stop reason |'
              echo '|------|-----------|---------|-----|-------|-------------|'
              python - <<'PY'
          import json, os
          with open('/tmp/verify/report.json') as f:
              data = json.load(f)
          for c in data.get('cards', []):
              gap = c['gap']
              mark = '✓' if gap == 0 else ('⚠️ +' + str(gap) if gap > 0 else '⚠️ ' + str(gap))
              print(f"| {c['identifier']} | {c['limitless_count']} | {c['our_count']} | {mark} | {c['pages_fetched']} | {c['stopped_reason']} |")
          PY
              echo ''
              echo "_Date floor: $(python -c "import json; print(json.load(open('/tmp/verify/report.json'))['start_date'])")_"
            else
              echo '_(no report.json produced — see stdout below)_'
            fi
            echo ''
            echo '<details><summary>Full stdout</summary>'
            echo ''
            echo '```'
            cat /tmp/verify/stdout.txt 2>/dev/null || echo '(no stdout captured)'
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: decklist-verify-report
          path: /tmp/verify/
          retention-days: 30
