name: Visual Fullpage Coverage

# KEIN naechtlicher Lauf mehr (05.09.2026).
#
# Der cron '0 3 * * *' stand hier seit dem 22.05.2026 — dem Tag, an dem
# tests/e2e/visual-full-page-coverage.spec.js auf 0 Byte fiel. Seitdem
# startete dieser Lauf jede Nacht, installierte Node und Chromium, fand
# dank `--pass-with-no-tests` keinen Test und meldete gruen. Rund 105
# Laeufe, die nichts geprueft und das Gegenteil behauptet haben.
#
# Der Aufrufer weigert sich jetzt, auf einer leeren Suite gruen zu
# melden (tests/e2e/run-visual-fullpage-ci.js). Damit waere der cron ab
# sofort jede Nacht rot — eine Meldung, an der niemand etwas tun kann,
# und nach der dritten Nacht liest sie ohnehin keiner mehr. Also bleibt
# der Lauf von Hand ausloesbar und schweigt, bis die Suite Inhalt hat.
#
# Was zurueckkommen muesste, damit der cron zurueckkommt, steht in
# docs/geparkte-features.md unter "Die naechtliche Ganzseiten-Suite".
on:
  workflow_dispatch:

jobs:
  visual-fullpage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run fullpage visual suite
        run: npm run test:visual:fullpage:ci

      - name: Upload fullpage visual artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-fullpage-report
          path: |
            test-results
            playwright-report
            tests/e2e/__snapshots__
