name: Visual Non-Meta Regression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  visual-nonmeta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run non-meta visual suite
        run: npm run test:visual:nonmeta:ci

      - name: Print summary
        if: always()
        run: npm run test:visual:nonmeta:report

      - name: Upload visual non-meta artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-nonmeta-report
          path: |
            visual-nonmeta-summary.txt
            visual-nonmeta-report.json
            test-results/
          if-no-files-found: warn
