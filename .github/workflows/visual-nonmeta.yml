name: Visual Non-Meta Regression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  visual-nonmeta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run non-meta visual suite
        run: npm run test:visual:nonmeta:ci

      - name: Print summary
        if: always()
        run: npm run test:visual:nonmeta:report

      - name: Upload visual non-meta artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: visual-nonmeta-report
          path: |
            visual-nonmeta-summary.txt
            visual-nonmeta-report.json
            test-results/
          if-no-files-found: warn
