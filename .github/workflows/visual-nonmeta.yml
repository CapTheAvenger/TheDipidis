name: Visual Non-Meta Regression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  visual-nonmeta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run non-meta visual suite
        run: npm run test:visual:nonmeta:ci

      - name: Print summary
        if: always()
        run: npm run test:visual:nonmeta:report

      - name: Upload visual non-meta artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-nonmeta-report
          path: |
            visual-nonmeta-summary.txt
            visual-nonmeta-report.json
            test-results/
          if-no-files-found: warn
