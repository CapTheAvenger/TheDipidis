name: Weekly Full Update

# Runs the headless-friendly subset of the local "FULL SYSTEM UPDATE"
# batch (BATCH_FULL in start_scraper_dashboard.py). all_cards_scraper
# was previously kept out of CI because it was once Selenium-based —
# it now uses cloudscraper + curl_cffi (same stack as the rest of the
# batch) so it runs here too. Without it, every new set release left
# the card DB stale (the 2026-05-22 CRI rotation made this user-
# visible: 0 CRI cards searchable in the Card DB tab for 4 days).
#
# japanese_cards_scraper now runs in this batch too (added 2026-06-13).
# It self-skips cheaply when the JP DB already has the latest sets
# (one index fetch → abort), and only does the full latest-4-sets
# scrape + per-card image detail-fetch when a new JP set drops. It
# sits right before prepare_card_data.py so the freshly-scraped JP
# cards get merged into all_cards_merged.json. Previously manual-only,
# which is why the M5 (2026-05-22) set never reached the Deck Builder
# even though weekly runs kept firing — the JP DB sat at M4 since the
# 2026-05-23 snapshot.
#
# Schedule: Tuesdays + Fridays 06:00 UTC (= 07:00 CET winter / 08:00 CEST summer)
# Manual trigger: GitHub UI → Actions → Weekly Full Update → Run workflow
#
# 2026-06-07: cron was briefly suspended for the Turin post-mortem.
# Re-enabled 2026-06-08 after the Predictor 5.6/5.8/5.9 redesign landed.
# 2026-06-12: added Friday slot so the Card DB + format/legality data
# refresh twice a week — the Tuesday-only cadence left Thu/Fri tournament
# weekends running against a 5-day-old snapshot.
on:
  schedule:
    - cron: '0 6 * * 2,5'
  workflow_dispatch:

# GITHUB_TOKEN needs:
#   - contents: write  → commit + push the scraped CSVs
#   - actions:  write  → kick off deploy-pages.yml at the end (push events
#                        from GITHUB_TOKEN don't trigger downstream
#                        workflows by default, so we dispatch explicitly)
permissions:
  contents: write
  actions:  write

# actions/checkout@v6 and actions/setup-python@v6 declare Node 24
# natively — no FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 hack needed.
# (Earlier the workflow used v4 / v5 + the env-var override, which
# still triggered a deprecation annotation because the action.yml
# files in those tags hard-code 'node20'. The v6 lines below are
# the proper fix.)

# Don't run multiple weekly updates in parallel — they'd race on the
# same monolith CSVs and produce conflicting commits.
concurrency:
  group: weekly-full-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Headroom: base scrapers ~30-60 min + matchup pass ~80 min for overall
    # filter alone (3250+ HTTP requests at 1.5s delay). Day-1 + Day-2
    # additional filters scale linearly. 300 min keeps a safety margin
    # over the worst case of overall+day2 (~160 min) for the matchup pass.
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Python 3.12+ is required: limitless_online_scraper uses PEP-701
      # f-string syntax (nested f-strings sharing the outer quote
      # delimiter) which 3.11 rejects with "invalid decimal literal".
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe labs.* reachability (diagnostic)
        # 2026-05-24 weekly runs at 13:17 + 16:42 UTC both produced
        # empty labs_tournament_decks.csv. This step logs whether
        # cloudscraper AND curl_cffi can each reach labs.limitlesstcg.com
        # so a maintainer can read the run-log and tell which Tier
        # failed (and whether escalating to a real-browser fallback is
        # warranted).
        run: |
          set +e
          python - <<'PYEOF'
          import sys
          # cloudscraper probe
          try:
              import cloudscraper
              cs = cloudscraper.create_scraper(browser={'browser':'chrome','platform':'windows','mobile':False})
              r = cs.get('https://labs.limitlesstcg.com/', timeout=15)
              print(f'[diag] cloudscraper: HTTP {r.status_code}, {len(r.text)} bytes')
          except Exception as e:
              print(f'[diag] cloudscraper: EXCEPTION {type(e).__name__}: {e}')
          # curl_cffi probe (Tier 3 fallback installed by PR #201)
          try:
              from curl_cffi import requests as cf
              r = cf.get('https://labs.limitlesstcg.com/', impersonate='chrome120', timeout=15)
              print(f'[diag] curl_cffi (chrome120): HTTP {r.status_code}, {len(r.text)} bytes')
          except ImportError:
              print('[diag] curl_cffi NOT INSTALLED (requirements.txt probably cached)')
          except Exception as e:
              print(f'[diag] curl_cffi: EXCEPTION {type(e).__name__}: {e}')
          PYEOF
          exit 0  # diagnostic, never fail the workflow

      # Seed backend/core/data/ from the project-root data/ folder.
      #
      # Locally, scrapers READ from backend/core/data/ and the
      # prepare_card_data.py finalizer SYNCS the results back to data/
      # for the frontend. On the GitHub runner only data/ is checked
      # out (that's what the frontend ships), so backend/core/data/
      # starts empty — and the dependency files like
      # all_cards_database.csv are unreachable, producing
      # "Karten-Datenbank ist leer!" errors in every scraper that
      # needs them.
      #
      # Seed backend/core/data/ with both the scraper INPUTS and the
      # prior-run OUTPUTS. Three categories, each load-bearing:
      #
      # (a) Input dependencies — card DBs, ID mapping, sets.json etc.
      #     Without these the scrapers' lookups fail outright.
      #
      # (b) State files (*_scraped*.json) — list of tournament IDs each
      #     incremental scraper has already processed. Without them the
      #     scraper thinks zero tournaments are scraped → tries to fetch
      #     all ~624 fresh, hits Cloudflare 429s + the 180-min job
      #     timeout, and produces a partial CSV.
      #
      # (c) Prior output CSVs — append-mode scrapers (city_league_analysis,
      #     current_meta_analysis, tournament_jh) MERGE new rows into
      #     existing CSVs at save_to_csv time. If the existing CSV isn't
      #     present in backend/core/data/, save_to_csv treats it as empty
      #     and writes only the new rows → after prepare_card_data.py
      #     syncs that tiny CSV back to data/, the historical rows are
      #     gone. This actually happened on 2026-05-02 (commit 8972aec)
      #     when (b) was added without (c): seed file said "all 744 IDs
      #     already scraped, skip them all" → scraper found 0 new
      #     tournaments → wrote a 1-row CSV → sync overwrote 152 588
      #     historical rows. (b) and (c) MUST stay paired; if you change
      #     either list, mirror it on the other side.
      #
      # prepare_card_data.SYNC_PATTERNS is the matching write-back list —
      # keep the two in lockstep when adding a new scraper output.
      - name: Seed backend/core/data/ from data/
        run: |
          mkdir -p backend/core/data
          for f in \
              all_cards_database.csv \
              all_cards_database.json \
              japanese_cards_database.csv \
              pokemonproxies_url_map.json \
              cardmarket_id_mapping.csv \
              price_data.csv \
              sets.json \
              sets_metadata.json \
              format_window.json \
              archetype_icons.json \
              formats_catalog.json \
              pokemon_card_text.json \
              pokemon_card_effects.json \
              active_threats.json \
              online_tournament_dated_cards.csv \
              city_league_analysis_scraped.json \
              city_league_analysis_past_scraped.json \
              tournament_jh_scraped.json \
              current_meta_scraped_tournaments.json \
              meta_play_decks_cache.json \
              city_league_analysis.csv \
              city_league_analysis_past.csv \
              city_league_archetypes.csv \
              city_league_archetypes_past.csv \
              city_league_archetypes_comparison.csv \
              city_league_archetypes_comparison_M3.csv \
              city_league_archetypes_deck_stats.csv \
              city_league_archetypes_past_comparison.csv \
              city_league_archetypes_past_deck_stats.csv \
              current_meta_card_data.csv \
              tournament_cards_data_cards.csv \
              tournament_cards_data_overview.csv \
              tournament_cards_manifest.json \
              labs_tournament_decks.csv \
              labs_tournament_matchups.csv \
              labs_tournaments.json \
              limitless_online_decks.csv \
              limitless_online_decks_comparison.csv \
              limitless_online_decks_matchups.csv \
              player_continuity.csv \
              tournament_decklists_per_player.csv \
              champions_replica_teams.json \
          ; do
              if [ -f "data/$f" ]; then
                  cp "data/$f" "backend/core/data/$f"
                  echo "  seeded: $f"
              fi
          done
          # Per-meta tournament chunks (Prague-data-loss fix). Without
          # these, _reassemble_monolith_from_chunks() finds an empty
          # backend/core/data/ on every CI run, the monolith stays tiny,
          # and prepare_card_data.py writes new chunks containing ONLY
          # the freshly-scraped tournament — silently dropping every
          # tournament that wasn't re-scraped this run. May 12 lost
          # Prague's 5783 rows from the TEF-POR chunk this way.
          for chunk in data/tournament_cards_data_cards_*.csv; do
              if [ -f "$chunk" ]; then
                  cp "$chunk" "backend/core/data/$(basename "$chunk")"
                  echo "  seeded chunk: $(basename "$chunk")"
              fi
          done
          # Labs per-meta chunks (2026-05-24 split refactor). Without these
          # the labs scraper's _reassemble_labs_monolith() sees an empty
          # cache and re-scrapes every historical tournament on every run.
          for chunk in data/labs_tournament_decks_*.csv \
                       data/labs_tournament_matchups_*.csv; do
              if [ -f "$chunk" ]; then
                  cp "$chunk" "backend/core/data/$(basename "$chunk")"
                  echo "  seeded labs chunk: $(basename "$chunk")"
              fi
          done

      # Cardmarket publishes daily JSON dumps on a public S3 bucket.
      # The cardmarket_id_mapper / cardmarket_price_merger scrapers
      # expect them at data/{products_singles_6,products_nonsingles_6,price_guide_6}.json.
      - name: Download Cardmarket JSONs
        run: |
          mkdir -p data
          curl -fsSL --retry 3 -o data/products_singles_6.json    https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json
          curl -fsSL --retry 3 -o data/products_nonsingles_6.json https://downloads.s3.cardmarket.com/productCatalog/productList/products_nonsingles_6.json
          curl -fsSL --retry 3 -o data/price_guide_6.json         https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json
          ls -lh data/*_6.json

      # Run scrapers in BATCH_FULL order.
      # `set +e` so a single scraper failure doesn't abort the whole
      # batch — we want partial progress committed at the end so we
      # don't lose six successful scrapers because one had a network
      # hiccup. Each failure is surfaced as a workflow warning so the
      # Actions UI shows it clearly.
      #
      # Order matters: all_cards_scraper feeds all_cards_database.csv,
      # which cardmarket_id_mapper, card-effects, card-text, and the
      # chunker all read. It must run BEFORE the mapper — otherwise
      # new-set cards have no Cardmarket-ID mapping and no merged
      # price entry. update_sets.py first so format_window / sets.json
      # reflect the latest rotation before any consumer reads them.
      - name: Run scrapers
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        working-directory: backend
        run: |
          set +e
          rc_summary=()
          # labs_tournament_scraper is invoked separately below with the
          # --matchups flag so the per-archetype matchup matrix
          # (labs_tournament_matchups.csv) gets refreshed alongside the
          # deck-list summary. Keeping it out of this loop lets us pass
          # workflow_dispatch inputs and adjust the day-filter list.
          for step in \
              "core/update_sets.py" \
              "scrapers/all_cards_scraper.py" \
              "scrapers/cardmarket_id_mapper.py" \
              "scrapers/current_meta_analysis_scraper.py" \
              "scrapers/limitless_online_scraper.py" \
              "scrapers/city_league_analysis_scraper.py" \
              "scrapers/city_league_archetype_scraper.py" \
              "scrapers/city_league_past_analysis_scraper.py" \
              "scrapers/city_league_past_archetype_scraper.py" \
              "scrapers/tournament_scraper_JH.py" \
              "scrapers/online_tournament_scraper.py" \
              "scrapers/cardmarket_price_merger.py" \
              "scrapers/japanese_cards_scraper.py" \
              "scrapers/scrape_pokemonproxies_urls.py" \
              "core/prepare_card_data.py" \
              "scrapers/archetype_icons_scraper.py" \
              "scrapers/pokemon_card_text_scraper.py" \
              "scrapers/pokemon_card_effects_scraper.py" \
              "tools/build_threat_intel.py" \
          ; do
              echo "::group::$step"
              python "$step"
              rc=$?
              if [ "$rc" -ne 0 ]; then
                  echo "::warning::Scraper $step exited with $rc (continuing batch)"
                  rc_summary+=("FAIL $step (rc=$rc)")
              else
                  rc_summary+=("OK   $step")
              fi
              # Mid-batch mirror: all_cards_scraper writes the freshly-
              # scraped card master DB to backend/core/data/ (its native
              # output dir), but the very next steps — cardmarket_id_mapper
              # and cardmarket_price_merger — read all_cards_database.csv
              # from the project-root data/ directory via get_project_data_dir().
              # Without this copy the mapper sees the stale seed (last
              # week's CSV) and produces mappings for last week's set
              # rotation only — exactly what happened on the 2026-05-22
              # CRI release: 122 CRI cards in the new scrape, 0 in the
              # mapping output → 0 CRI prices → N/A in every Wishlist /
              # Trade List / Deck Builder grid for 2 weeks running. The
              # end-of-batch prepare_card_data sync would have caught it
              # too late (mapper had already run against stale data).
              if [ "$step" = "scrapers/all_cards_scraper.py" ]; then
                  for mirror in all_cards_database.csv all_cards_database.json; do
                      if [ -f "core/data/$mirror" ]; then
                          cp "core/data/$mirror" "../data/$mirror"
                          echo "  ↳ mirrored $mirror to data/"
                      fi
                  done
              fi
              echo "::endgroup::"
          done
          echo "── Summary ──"
          printf '  %s\n' "${rc_summary[@]}"

          # F-D04 + F-D20 (AUDIT_DATA_PIPELINE): the per-step `set +e`
          # is intentional — single Cloudflare hits shouldn't kill an
          # 8-scraper batch — but a SILENT all-fail (e.g. PyPI infra
          # outage, IP-block on the runner pool) would slip through
          # green. Surface anything more than a single non-zero exit
          # as a job-level `::error::` so GitHub fires the default
          # maintainer email-notification. Single sporadic failures
          # stay as `::warning::` only.
          fail_count=$(printf '%s\n' "${rc_summary[@]}" | grep -c '^FAIL ' || true)
          critical_failed=$(printf '%s\n' "${rc_summary[@]}" \
            | grep -E '^FAIL (core/update_sets|scrapers/all_cards_scraper|scrapers/current_meta_analysis_scraper|scrapers/limitless_online_scraper)' \
            | wc -l)
          echo "  failed_step_count=$fail_count critical_failed=$critical_failed"
          if [ "$fail_count" -gt 2 ] || [ "$critical_failed" -gt 0 ]; then
            echo "::error::Weekly scraper batch: $fail_count step(s) failed (critical_failed=$critical_failed). Manual review needed."
            echo "WEEKLY_FAIL_REASON=$fail_count steps failed (critical=$critical_failed)" >> "$GITHUB_ENV"
          fi

      - name: Run labs tournament scraper (deck list + matchups)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        working-directory: backend
        # Matchups re-enabled 2026-05-25 after PR #212 fixed the URL +
        # schema. New combined-view scrape is ~one HTTP per (meta, slug,
        # day_filter); skip-if-already-scraped keeps closed metas frozen
        # so weekly runs only re-fetch current meta + first-time fills.
        #
        # --matchup-days overall day1 day2 enabled 2026-06: the engine
        # blends three labs sources per pair (Day-2 45 % / Day-1 35 % /
        # Online 20 %) when computing matchup WR. Overall stays
        # populated as a fallback anchor for pairs where neither Day-1
        # nor Day-2 has enough samples. Cost: ~3× matchup HTTP count
        # for the current meta only — past metas are skipped by the
        # skip-if-already-scraped logic. To backfill Day-1 / Day-2 for
        # a closed meta, run locally:
        #   python labs_tournament_scraper.py --matchups \
        #          --matchup-meta SVI-JTG --matchup-days day1 day2
        #
        # Backfill (--id-range) is not exposed: the 0001..0066 backfill
        # is already done and existing rows get re-classified into
        # per-meta chunks every run via the name-based cards-data
        # crossref. Add a workflow_dispatch input back if either
        # capability is needed ad-hoc.
        run: |
          set +e
          echo "::group::scrapers/labs_tournament_scraper.py"
          python scrapers/labs_tournament_scraper.py --matchups --matchup-days overall day1 day2
          rc=$?
          if [ "$rc" -ne 0 ]; then
              echo "::warning::labs_tournament_scraper exited with $rc"
          fi
          echo "::endgroup::"
          # Always exit 0 — failures here shouldn't kill the whole pipeline
          # (matchup CSV is gracefully optional in Meta Call).
          exit 0

      - name: Run player-continuity scraper
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        working-directory: backend
        # Depends on labs_tournaments.json + labs_tournament_decks.csv
        # for the tid index + slug→archetype mapping. Run AFTER the
        # labs scraper so any newly-scraped tournaments get player-
        # continuity data captured in the same weekly run.
        #
        # --resume + --from-date keeps the runtime bounded: only fresh
        # tournament IDs since the last scrape get fetched. Initial
        # backfill happened on 2026-06-08 via the standalone workflow
        # (player-continuity-scrape.yml), so steady-state runs add only
        # the 1-3 new Regionals per week.
        run: |
          set +e
          echo "::group::scrapers/player_continuity_scraper.py"
          python scrapers/player_continuity_scraper.py --resume --from-date 2026-04-01
          rc=$?
          if [ "$rc" -ne 0 ]; then
              echo "::warning::player_continuity_scraper exited with $rc"
          fi
          echo "::endgroup::"
          exit 0  # never block the pipeline — Predictor 5.8 degrades
                  # gracefully when the CSV is missing

      - name: Run per-decklist scraper (success-weighted card stats)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        # Preserves per-(tournament × player × card) resolution. Reads
        # the JH scraper's tournament_jh_scraped.json index so newly-
        # discovered tournaments from THIS run get covered. --resume
        # skips tournaments already in the output CSV → steady-state
        # adds only the 1-3 new Regionals each week. Net runtime
        # ~3-5 min for that delta. Failure non-blocking — the
        # deck-builder degrades gracefully to archetype-aggregated
        # stats when the per-list CSV is empty or missing.
        run: |
          set +e
          echo "::group::scrapers/per_decklist_scraper.py"
          python backend/scrapers/per_decklist_scraper.py --resume
          rc=$?
          if [ "$rc" -ne 0 ]; then
              echo "::warning::per_decklist_scraper exited with $rc"
          fi
          echo "::endgroup::"
          exit 0

      - name: Run champions-replica scraper (Pokémon Champions Side Quest)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/core
        working-directory: backend
        # Independent feature, unrelated to TCG. Pulls the VGCPastes
        # Champions M-A Repository Google Sheet (published-CSV export)
        # + pokepast.es for each team's Showdown-format paste, writes
        # data/champions_replica_teams.json for the Side Quest tab.
        # Total HTTP: 1 (sheet) + N (one per pokepaste, default top-20)
        # with a 0.7 s delay → ~15 s. Failure is non-blocking; the
        # tab gracefully falls back to whatever JSON was last shipped.
        run: |
          set +e
          echo "::group::scrapers/champions_replica_scraper.py"
          python scrapers/champions_replica_scraper.py --top 20
          rc=$?
          if [ "$rc" -ne 0 ]; then
              echo "::warning::champions_replica_scraper exited with $rc"
          fi
          echo "::endgroup::"
          exit 0

      - name: Sync labs output to data/ (post-scraper)
        # prepare_card_data.py's SYNC_PATTERNS step runs IN the loop
        # above, BEFORE the labs scraper. So the labs CSVs that labs
        # writes to backend/core/data/ never get copied to data/ at
        # sync time. This explicit step picks them up — including the
        # per-meta chunks (labs_tournament_decks_<META>.csv etc.) that
        # the 2026-05-24 per-meta split refactor introduced.
        run: |
          set +e
          mkdir -p data
          # Monolith files first
          for f in labs_tournament_decks.csv labs_tournament_matchups.csv labs_tournaments.json player_continuity.csv tournament_decklists_per_player.csv champions_replica_teams.json champions_speed_corpus.json; do
              if [ -f "backend/core/data/$f" ]; then
                  cp "backend/core/data/$f" "data/$f"
                  sz=$(stat -c%s "data/$f")
                  echo "  ✓ synced $f ($sz B)"
              fi
          done
          # Per-meta chunks (labs_tournament_decks_TEF-POR.csv,
          # labs_tournament_matchups_SVI-PFL.csv, etc.) — glob-copy so
          # newly-introduced metas don't need a workflow update each
          # rotation cycle.
          shopt -s nullglob
          for f in backend/core/data/labs_tournament_decks_*.csv \
                   backend/core/data/labs_tournament_matchups_*.csv; do
              base=$(basename "$f")
              cp "$f" "data/$base"
              sz=$(stat -c%s "data/$base")
              echo "  ✓ synced chunk $base ($sz B)"
          done
          shopt -u nullglob
          exit 0

      # No bump here. deploy-pages.yml rewrites ?v=, APP_VERSION, the service
      # worker CACHE_NAME, version.json and the _formatWindow snapshot inside
      # _site/ on every deploy (its "Cache-bust asset references" step), so the
      # stamp a data job commits never reaches a user. All it did was put
      # index.html (845 KB), service-worker.js and version.json into ~147
      # commits a month and churn the service worker's CACHE_NAME, which makes
      # the activate handler drop every client cache several times a day.

      - name: Data sanity check (F-D19 — revert empty/short CSVs before commit)
        # AUDIT_DATA_PIPELINE.md F-D19 — the commit step below pushes any
        # diff git sees, including header-only CSVs from a Cloudflare
        # escalation or other source failure. This step enforces per-file
        # minimum row thresholds and `git checkout`s any CSV that drops
        # below its floor, so the previous good snapshot survives.
        # Sommerpause / known-empty files are listed with threshold=0 in
        # the script and pass through with a ::watch:: line.
        # Always exits 0 — the failure mode is "this file got rolled
        # back", not "the pipeline is broken".
        run: |
          python3 scripts/sanity_check_data.py data

      - name: Tournament coverage reconciliation (cross-pipeline gap check)
        # Companion to the row-count gate above. That one catches EMPTY files;
        # this one catches a tournament that was scraped on one surface (labs)
        # but never propagated into the cards file the tabs read — the file is
        # full, just missing a major. This is the NAIC class of bug. Soft by
        # design: it emits a ::warning:: (visible on the run page) and exits 0,
        # so a not-yet-propagated major never blocks the weekly commit. Flip to
        # `--strict` once we trust it to gate the commit.
        run: |
          python3 scripts/reconcile_tournament_coverage.py data

      - name: Upload scraper logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scraper-logs
          path: |
            backend/data/*.log
            backend/logs/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit + push
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "Auto: weekly full update — ${ts}

          Triggered by .github/workflows/weekly-full-update.yml
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Push with retry — the scraper job runs ~45 min, in which
          # time origin/main can advance (manual pushes from the
          # maintainer, an earlier scheduled run still committing,
          # etc.). A naive `git push` would 'rejected (fetch first)'
          # and the whole hour of scraped data would sit unpushed.
          #
          # Strategy: pull --rebase with -X ours so our just-baked
          # data + version-bump win on conflict (this run's outputs
          # are by definition the newest snapshot). -X ours only
          # affects FILES BOTH SIDES MODIFIED — code-only changes
          # the maintainer pushed are untouched and ride along on
          # the rebase base. Three attempts, brief sleep between
          # them, then loud failure with the artifact still safe
          # in the runner's checkout.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — pulling with rebase…"
            if ! git pull --rebase=true -X ours origin main; then
              echo "::error::Rebase conflict beyond version files — manual resolution needed"
              git rebase --abort || true
              exit 1
            fi
          done
          echo "::error::Push failed after 3 attempts — origin/main churns too fast"
          exit 1

      # Pushes authenticated with GITHUB_TOKEN don't trigger other
      # `on: push` workflows (GitHub recursion-prevention). Dispatch
      # deploy-pages explicitly so the SPA on Pages always reflects the
      # fresh data right after a weekly run.
      # No explicit deploy dispatch. The push above already triggers
      # deploy-pages (on: push to main); dispatching a second run put both into
      # `concurrency: pages, cancel-in-progress: true`, so one of the two was
      # cancelled and the deploy could end up watching or reporting the loser.
      # One push, one deploy.

      - name: Fail job on multi-scraper / critical-scraper batch failure
        # AUDIT_DATA_PIPELINE F-D04 + F-D20: per-step `set +e` keeps a
        # single sporadic failure from killing the whole batch (intended,
        # since most Cloudflare hits self-recover next run), but a
        # multi-fail or critical-scraper-fail needs to surface as a
        # job-level failure so the maintainer's default email
        # notification fires. The Run-scrapers step sets WEEKLY_FAIL_REASON
        # when fail_count > 2 OR critical_failed > 0; we just promote it
        # to the job conclusion here, AFTER the commit + dispatch so the
        # partial data still ships through.
        if: env.WEEKLY_FAIL_REASON != ''
        run: |
          echo "::error::$WEEKLY_FAIL_REASON"
          exit 1
