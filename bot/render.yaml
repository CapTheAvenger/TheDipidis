# Render.com blueprint for the Telegram bot.
# https://render.com/docs/blueprint-spec
#
# Deploy by clicking "New" → "Blueprint" on the Render dashboard and
# pointing it at this repo. Set the secret env vars (BOT_TOKEN,
# ALLOWED_USER_IDS, ADMIN_USER_IDS) on the resulting service.
#
# Free tier notes:
#   • Spins down after 15 min of inactivity. First request after sleep
#     takes ~30 s (cold start + bot.launch). For a personal bot this
#     is acceptable; if you want zero-cold-start, switch plan to
#     starter ($7/mo) which keeps the dyno warm.
#   • 750 hrs/mo across all Render Free services — enough for one
#     bot running 24/7.

services:
  - type: web
    name: thedipidis-bot
    env: node
    region: frankfurt
    plan: free
    rootDir: bot
    # No Puppeteer at runtime anymore — Meta Call rendering moved
    # to the GitHub Pages deploy (see prerender/). The bot just
    # fetches https://thedipidis.app/data/meta-call-snapshot.png.
    # Build is now Express + Telegraf only — under 30 s.
    # `npm ci` since bot/package-lock.json is now committed
    # (AUDIT_GITHUB.md F-19) — deterministic install + faster than
    # `npm install` re-resolves a tree on each cold start.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    # Auto-deploy on every push to main. Required so renamed/removed
    # dependencies (the Puppeteer rip-out being the prime example)
    # actually leave the dyno's node_modules. Without this, a stale
    # cached build can serve old code months after a refactor.
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false             # set on dashboard, never in git
      - key: ALLOWED_USER_IDS
        sync: false             # comma-separated Telegram user IDs
      - key: ADMIN_USER_IDS
        sync: false             # admin IDs — can approve /start requests in chat
      - key: NODE_VERSION
        value: 22
