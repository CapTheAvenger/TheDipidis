# Render.com blueprint for the Telegram bot.
# https://render.com/docs/blueprint-spec
#
# Deploy by clicking "New" → "Blueprint" on the Render dashboard and
# pointing it at this repo. Set the secret env vars (BOT_TOKEN,
# ALLOWED_USER_IDS) on the resulting service.
#
# Free tier notes:
#   • Spins down after 15 min of inactivity. First request after sleep
#     takes ~30 s (cold start + bot.launch). For a personal bot this
#     is acceptable; if you want zero-cold-start, switch plan to
#     starter ($7/mo) which keeps the dyno warm.
#   • 750 hrs/mo across all Render Free services — enough for one
#     bot running 24/7.

services:
  - type: web
    name: thedipidis-bot
    env: node
    region: frankfurt
    plan: free
    rootDir: bot
    # We pin the Chromium install to a folder INSIDE the repo build
    # output (`bot/.cache/puppeteer`) so Render's runtime can find
    # it at the same path the build wrote it to. Render Free has no
    # persistent disk, so this means a fresh ~280 MB Chromium
    # download every deploy — acceptable for a bot that redeploys
    # only on code changes.
    buildCommand: npm install && npx --yes puppeteer browsers install chrome
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false             # set on dashboard, never in git
      - key: ALLOWED_USER_IDS
        sync: false             # comma-separated Telegram user IDs
      - key: NODE_VERSION
        value: 22
      # Without an explicit cache dir Puppeteer's installer writes
      # to ~/.cache/puppeteer (= /opt/render/.cache/puppeteer)
      # while the runtime looks there too — but Render moves the
      # built artifact and the home-relative cache doesn't always
      # travel with it. Pinning the dir to a project-relative path
      # keeps install + lookup pointing at the same place.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/bot/.cache/puppeteer
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: 'false'
